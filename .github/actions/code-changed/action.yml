# Did this PR / push change anything besides docs?
#
# Checks and Lint are meant to be REQUIRED status checks, and a required check has to report on
# every PR — a workflow skipped by `paths-ignore` never reports, so a docs-only PR would wait on it
# forever. Those jobs therefore always run and call this first: on a docs-only change every later
# step is skipped (`if: steps.<id>.outputs.code == 'true'`) and the job passes in seconds, having
# installed nothing. It is a step, not a gating job, because a job skipped by `if:` reports ONE
# check with the matrix name unexpanded (`check-all (${{ matrix.shard }}/3)`), never the three.
#
# "Docs" is what paths-ignore used to skip: docs/**, any *.md, .claude/**. The first push of a new
# branch has no `before` (all zeros), so it diffs against its merge-base with main. Anything the
# diff cannot decide (an unreachable `before` after a force-push, another event) counts as code.
#
# Needs the checkout to have fetched the PR merge commit's parent: `fetch-depth: 2`.

name: code-changed
description: Sets `code` to 'true' unless every changed file is docs, Markdown or .claude/.

outputs:
  code:
    description: "'true' when a non-docs file changed (or the change set is unknown)"
    value: ${{ steps.diff.outputs.code }}

runs:
  using: composite
  steps:
    - id: diff
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        BEFORE: ${{ github.event.before }}
      run: |
        base=''
        # Depth flags only on a shallow checkout: on a full one (fetch-depth: 0) they would MAKE it
        # shallow, cutting the history a later merge-base needs.
        shallow="$(git rev-parse --is-shallow-repository)"
        if [ "$EVENT" = pull_request ]; then
          base="$(git rev-parse -q --verify 'HEAD^1' || true)"
        elif [ "$EVENT" = push ] && [ -z "${BEFORE//0/}" ]; then
          # A new branch: diff against where it left main (a branch is rarely 200 commits behind).
          if [ "$shallow" = true ]; then
            git fetch -q --no-tags --depth=200 origin +refs/heads/main:refs/remotes/origin/main &&
              git fetch -q --no-tags --deepen=200 origin "$GITHUB_REF" || true
          else
            git fetch -q --no-tags origin +refs/heads/main:refs/remotes/origin/main || true
          fi
          base="$(git merge-base origin/main HEAD 2>/dev/null || true)"
        elif [ "$EVENT" = push ]; then
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          elif [ "$shallow" = true ]; then
            git fetch -q --no-tags --depth=1 origin "$BEFORE" 2>/dev/null && base="$BEFORE"
          else
            git fetch -q --no-tags origin "$BEFORE" 2>/dev/null && base="$BEFORE"
          fi
        fi
        if [ -z "$base" ] || ! files="$(git diff --name-only "$base" HEAD)"; then
          echo "::notice::change set unknown — running every step"
          echo code=true >> "$GITHUB_OUTPUT"
          exit 0
        fi
        code="$(printf '%s\n' "$files" | grep -Ev '^$|^docs/|^\.claude/|\.md$' || true)"
        if [ -n "$code" ]; then
          printf 'non-docs changes:\n%s\n' "$code" | head -20
          echo code=true >> "$GITHUB_OUTPUT"
        else
          echo "::notice::docs-only change — skipping the heavy steps"
          echo code=false >> "$GITHUB_OUTPUT"
        fi
