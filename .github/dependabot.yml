# Dependabot — weekly, grouped dependency updates, plus security updates.
#
# VERSION updates: one grouped PR per ecosystem per week for minor + patch bumps, so a week's
# churn is one review, not thirty. A MAJOR bump gets its own PR (it is the one that needs reading),
# and `open-pull-requests-limit` caps how many can sit open at once so the queue never floods.
# pip is the exception: its requirements are floors, so all its bumps share one PR (see below).
#
# SECURITY updates: raised as soon as an advisory lands, not on the weekly schedule, grouped per
# ecosystem the same way. They need "Dependabot security updates" switched on in the repo settings
# (docs/INFRA.md "Dependabot"); this file alone only configures them. Their open-PR cap is
# GitHub's own (10), not the limits below.
#
# GATED LIKE ANY PR: a Dependabot PR runs Checks, Lint and Secrets and cannot merge until the six
# required checks pass — no bypass. None of those jobs needs a secret, which matters because
# Dependabot-triggered runs get none. The subjects use scopes the commit-msg hook accepts (`deps:`,
# `ci:`), since the squash-merged PR title becomes the commit on `main`.

version: 2

updates:
  # The pnpm workspace: the root lockfile covers apps/*, packages/* and the tools/*-spike packages.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    # SPINE: 4.2.x patches only. A Spine runtime reads exactly one editor version's data, and every
    # skeleton we export and the Rigger's `.irig` are Spine 4.2 JSON — semver calls 4.2 → 4.3 a
    # minor, but for Spine it is a data-format boundary (it rode into the weekly group once, #911).
    # Moving to 4.3 is a deliberate project: re-export every asset from Spine 4.3 and move the
    # Rigger's format, the vendored spine-webgl and the spikes along with the runtime.
    # `scripts/check-spine-version.mjs` (check:all) refuses a hand bump the same way.
    ignore:
      - dependency-name: '@esotericsoftware/*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ['*']

  # Python: the two pipeline services and the backup job. The backup pins are hash-checked
  # (`--require-hashes`); Dependabot rewrites the hashes with the version.
  - package-ecosystem: pip
    directories:
      - /services/atlas-tool
      - /services/sheet-tool
      - /scripts/backup
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps
    groups:
      # ALL pip version updates in one PR, majors included. The services pin FLOORS (`boto3>=…`),
      # so Dependabot sees no current version and cannot call a bump minor or patch: with an
      # `update-types` filter here, every one of them fell out of the group into its own PR (the
      # first run opened five). A floor bump is low-risk: a fresh image build installs the latest anyway.
      pip:
        applies-to: version-updates
        patterns: ['*']
      pip-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      actions:
        applies-to: version-updates
        patterns: ['*']
      actions-security:
        applies-to: security-updates
        patterns: ['*']
