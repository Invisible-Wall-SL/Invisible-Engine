# Dependabot — weekly, grouped dependency updates, plus security updates.
#
# VERSION updates: one grouped PR per ecosystem per week for minor + patch bumps, so a week's
# churn is one review, not thirty. A MAJOR bump gets its own PR (it is the one that needs reading),
# and `open-pull-requests-limit` caps how many can sit open at once so the queue never floods.
# pip is the exception: its requirements are floors, so all its bumps share one PR (see below).
#
# SECURITY updates: raised as soon as an advisory lands, not on the weekly schedule, grouped per
# ecosystem the same way. They need "Dependabot security updates" switched on in the repo settings
# (docs/INFRA.md "Dependabot"); this file alone only configures them. Their open-PR cap is
# GitHub's own (10), not the limits below.
#
# GATED LIKE ANY PR: a Dependabot PR runs Checks, Lint and Secrets and cannot merge until every
# required check passes — no bypass. Those three need no secret, but the required `current-games`
# check does (it renders every live game from R2), and Dependabot-triggered runs get no Actions
# secrets, so it can never pass there. A Dependabot PR that touches the runtime (npm, or anything
# current-games builds) is therefore RE-LANDED: its changes are applied on a normal branch from
# `main` in one PR, which current-games really runs, and the Dependabot PR is closed. A PR that
# edits the harness (`.github/workflows/**`) is re-landed on its own, as it needs an owner-posted
# status (docs/INFRA.md "Dependabot"). The subjects use scopes the commit-msg hook accepts
# (`deps:`, `ci:`), since the squash-merged PR title becomes the commit on `main`.

version: 2

updates:
  # The pnpm workspace: the root lockfile covers apps/*, packages/* and the tools/*-spike packages.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    # `@types/node` follows the Node runtime (22, `engines` in package.json), not the newest Node.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ['*']

  # Python: the two pipeline services and the backup job. The backup pins are hash-checked
  # (`--require-hashes`); Dependabot rewrites the hashes with the version.
  - package-ecosystem: pip
    directories:
      - /services/atlas-tool
      - /services/sheet-tool
      - /scripts/backup
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps
    groups:
      # ALL pip version updates in one PR, majors included. The services pin FLOORS (`boto3>=…`),
      # so Dependabot sees no current version and cannot call a bump minor or patch: with an
      # `update-types` filter here, every one of them fell out of the group into its own PR (the
      # first run opened five). A floor bump is low-risk: a fresh image build installs the latest anyway.
      pip:
        applies-to: version-updates
        patterns: ['*']
      pip-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      actions:
        applies-to: version-updates
        patterns: ['*']
      actions-security:
        applies-to: security-updates
        patterns: ['*']
