# Invisible Profiler lab runs (P6, docs/design/invisible-profiler.md §6): each live online game,
# played headless with `?perf=1` (scripts/playtest/lab-run.mjs: idle 20 s, 10 spins, a forced feature
# where the mock takes one), its reading posted to the launcher as a `lab` reading. The Profiler's
# Lab runs card compares it with the game's previous lab reading on counts, never on fps (SwiftShader
# on a shared runner swings ~2× run to run).
#
# Nightly over every live online game (the current-games harness's own list, `/api/pipeline/games`),
# and on demand for one game (`game`) or all (empty).
#
# The Salmons lab (`salmons`): Salmons' room, played headless for a minute (scripts/playtest/salmons-lab.mjs),
# on demand only. It builds the runtime itself, runs three times and compares with the committed baseline
# (scripts/playtest/fixtures/salmons-lab-baseline.json); it posts nothing and needs no secret.
#
# SECRETS: the current-games harness's own two, no new one — PIPELINE_GAMES_URL (the launcher is its
# origin) and PIPELINE_CI_TOKEN (opens each game's 2-hour lab session). It reads nothing from R2 and
# posts only readings.

name: Profiler lab run

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      game:
        description: A game key (empty = every live online game)
        type: string
        default: ''
      salmons:
        description: Run the Salmons lab (local game server, three runs) instead of the games
        type: boolean
        default: false

concurrency:
  group: profiler-lab-${{ inputs.game || 'all' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  list:
    if: ${{ !inputs.salmons }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      games: ${{ steps.list.outputs.games }}
    steps:
      - name: List the games
        id: list
        env:
          PIPELINE_GAMES_URL: ${{ secrets.PIPELINE_GAMES_URL }}
          PIPELINE_CI_TOKEN: ${{ secrets.PIPELINE_CI_TOKEN }}
          GAME: ${{ inputs.game }}
        run: |
          set -euo pipefail
          for name in PIPELINE_GAMES_URL PIPELINE_CI_TOKEN; do
            [ -n "${!name}" ] || { echo "::error::missing secret $name"; exit 1; }
          done
          if [ -n "$GAME" ]; then
            jq -cn --arg g "$GAME" '[$g]' > games.json
          else
            curl -fsS --max-time 60 -H "Authorization: Bearer $PIPELINE_CI_TOKEN" "$PIPELINE_GAMES_URL" \
              | jq -c '[.games[] | select(.projectKey != null and (.hasOwnBuiltBundle | not)) | .key]' > games.json
          fi
          echo "games=$(cat games.json)" >> "$GITHUB_OUTPUT"
          echo "lab run over $(jq length games.json) game(s)"

  run:
    needs: list
    if: needs.list.outputs.games != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        game: ${{ fromJSON(needs.list.outputs.games) }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      # The shell and its apt deps, as current-games installs them (scripts/current-games/headless-shell.sh).
      - name: Key the headless shell cache
        id: shell
        run: echo "key=$(scripts/current-games/headless-shell.sh key)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: .cache/headless-shell
          key: ${{ steps.shell.outputs.key }}

      - name: Install the headless shell
        timeout-minutes: 15
        run: scripts/current-games/headless-shell.sh install .cache/headless-shell profiler-lab

      # Ubuntu 24.04 restricts unprivileged user namespaces, so the shell's sandbox cannot start
      # (current-games.yml says why this, rather than --no-sandbox).
      - name: Let the headless shell start its sandbox
        run: |
          f=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$f" ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi

      # Below the job's limit, so a stuck run still uploads what it wrote.
      - name: Lab run ${{ matrix.game }}
        timeout-minutes: 25
        env:
          PIPELINE_GAMES_URL: ${{ secrets.PIPELINE_GAMES_URL }}
          PIPELINE_CI_TOKEN: ${{ secrets.PIPELINE_CI_TOKEN }}
          GAME: ${{ matrix.game }}
        run: |
          node --experimental-strip-types --no-warnings --import ./scripts/ts-loader.mjs \
            scripts/playtest/lab-run.mjs --game "$GAME" --out lab

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: profiler-lab-${{ matrix.game }}
          retention-days: 7
          path: lab

  salmons:
    if: ${{ inputs.salmons }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Key the headless shell cache
        id: shell
        run: echo "key=$(scripts/current-games/headless-shell.sh key)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: .cache/headless-shell
          key: ${{ steps.shell.outputs.key }}

      - name: Install the headless shell
        timeout-minutes: 15
        run: scripts/current-games/headless-shell.sh install .cache/headless-shell profiler-lab

      - name: Let the headless shell start its sandbox
        run: |
          f=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$f" ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi

      - name: Build the runtime
        timeout-minutes: 15
        run: pnpm --filter lines build

      - name: Salmons lab
        timeout-minutes: 15
        run: |
          node --experimental-strip-types --no-warnings --import ./scripts/ts-loader.mjs \
            scripts/playtest/salmons-lab.mjs --runs 3 --out lab \
            --compare scripts/playtest/fixtures/salmons-lab-baseline.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: salmons-lab
          retention-days: 7
          path: lab
