name: Build Atlas ComfyUI worker

# Builds the RunPod Serverless worker image and pushes it to GHCR.
# The serverless endpoint pulls ghcr.io/invisible-wall-sl/atlas-comfy-worker:latest.
on:
  push:
    # main only. Rebuilding this image on every push to a dev branch cost real minutes for
    # an image nothing deploys from yet; `workflow_dispatch` still builds any branch on demand.
    branches: [main]
    paths:
      - services/atlas-serverless/**
      # The node list lives with the R&D pod image and is SHARED — a promotion is an edit to
      # that file, and prod has to rebuild for it to mean anything.
      - services/atlas-comfy-pod/nodes.json
      # Vendored and shared the same way — a fix to it must reach prod, not just the pod.
      - services/atlas-comfy-pod/custom_nodes/ComfyUI-SemanticLayers/**
      - .github/workflows/atlas-comfy-worker.yml
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # A CUDA image (torch + ComfyUI + insightface) overruns the runner's ~14 GB
      # disk. Reclaim ~25 GB of preinstalled toolchains we don't use.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ONE node list, two images. This build takes the entries flagged `prod`; the R&D pod
      # takes them all. Copied in rather than shared because Docker COPY cannot escape its
      # build context, and moving the context to the repo root would ship the whole monorepo
      # to a runner that already reclaims ~25 GB of disk to fit a CUDA image.
      #
      # ComfyUI-SemanticLayers rides along from the same source of truth, for the same
      # reason: it is vendored (no `url`), so `prod` in nodes.json cannot carry it and a
      # COPY is the only route. `rm -rf` first so a renamed or deleted file inside the
      # pack cannot survive in the context as a ghost.
      - name: Take the shared node sources into this build context
        run: |
          cp services/atlas-comfy-pod/nodes.json services/atlas-serverless/nodes.json
          rm -rf services/atlas-serverless/custom_nodes/ComfyUI-SemanticLayers
          cp -r services/atlas-comfy-pod/custom_nodes/ComfyUI-SemanticLayers \
                services/atlas-serverless/custom_nodes/ComfyUI-SemanticLayers

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/atlas-serverless
          push: true
          # Stamped into the image so a running worker can say which commit it is.
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/invisible-wall-sl/atlas-comfy-worker:latest
            ghcr.io/invisible-wall-sl/atlas-comfy-worker:${{ github.sha }}
          # Registry cache with mode=max — NOT `type=gha,mode=min`. `min` caches only the
          # FINAL layer, so every rebuild re-ran the multi-GB torch/ComfyUI/insightface pip
          # steps from cold (~12 min a build; these two image workflows alone burned a quarter
          # of August's Actions minutes and helped exhaust the free allowance). GHA cache is
          # capped at 10 GB/repo besides, which a CUDA image blows straight through, so even
          # that one layer thrashed. GHCR has no cap and is readable from every branch.
          # `image-manifest`/`oci-mediatypes` are what GHCR needs to accept a cache manifest.
          cache-from: type=registry,ref=ghcr.io/invisible-wall-sl/atlas-comfy-worker:buildcache
          cache-to: type=registry,ref=ghcr.io/invisible-wall-sl/atlas-comfy-worker:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
