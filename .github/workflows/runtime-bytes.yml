# runtime-bytes — the released runtimes are exactly the bytes `scripts/runtime-bytes/<id>.json` records.
#
# WHY THIS EXISTS: 3D ships as its own runtime (`docs/design/3d-games.md`), and the owner's constraint
# is that the 2D runtimes stay byte-identical, file for file, while it is built. Code isolation alone
# cannot show that; this builds every runtime reproducibly (`IE_REPRODUCIBLE=1`) and compares each file
# with its committed manifest (`scripts/check-runtime-bytes.mjs`).
#
# A PR that MEANS to change a runtime (any ordinary engine change) commits the new manifests, and the
# manifest diff is what review reads. They are Linux's bytes: on a failure this job uploads the
# manifests it built as the `runtime-bytes` artifact, so re-recording is
#
#   gh run download <run id> -n runtime-bytes -D scripts/runtime-bytes
#
# rather than four local builds on another OS (a Windows checkout builds other bytes). A change on a
# path that cannot legitimately reach a 2D runtime (packages/engine-3d, the family seams, the build
# config, the lockfile) failing here is a leak.
#
# It runs only when the change set touches the engine, the lockfile or this gate; otherwise it passes in
# seconds, so it can be a required check (it always reports). Required or not is the owner's ruleset
# (docs/INFRA.md "Branch ruleset on main").

name: runtime-bytes

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: runtime-bytes-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  runtime-bytes:
    name: runtime-bytes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The whole history (no blobs): a push is diffed with the last main commit whose run built.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      # Not this push's own diff: a later push may cancel an engine push's run. A push is diffed with
      # the last main commit whose run built and compared (`check-runtime-bytes.mjs --reaches`).
      - name: Does the change reach a runtime?
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-runtime-bytes.mjs --reaches >> "$GITHUB_OUTPUT"

      - if: steps.changes.outputs.run == 'true'
        uses: ./.github/actions/setup

      - name: Build every runtime reproducibly and compare with its manifest
        if: steps.changes.outputs.run == 'true'
        run: pnpm check:runtime-bytes --out runtime-bytes-built

      - name: Upload the manifests this run built
        if: ${{ failure() && steps.changes.outputs.run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: runtime-bytes
          path: runtime-bytes-built/*.json
          if-no-files-found: ignore
