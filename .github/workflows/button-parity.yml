# The authored buttons vs the coded ones, frame for frame (Rive plan Phase 8d, §13.8.8): builds the
# `lines` runtime the way the release does and renders every variant on both sides in the headless
# shell (`scripts/button-parity/run.mjs`, `pnpm check:button-parity`). Its own workflow, as
# `transition-parity.yml`, `win-parity.yml` and `freespin-parity.yml` are: the Checks shards have no
# build, and the current-games verdict treats every workflow file as harness, so it lives apart from
# the runtime change it proves (#1236 and its follow-up).
#
# ADVISORY: not in the required checks (docs/INFRA.md, "Required checks"); the owner decides whether
# it joins them. Path-filtered like its twins: it runs only when something it measures can change
# (the runtime, the shared packages, the harness libraries it borrows, the mock RGS, the lockfile)
# or this file itself.

name: Button parity

on:
  pull_request:
    paths:
      - '.github/workflows/button-parity.yml'
      - 'apps/lines/**'
      - 'packages/**'
      - 'scripts/button-parity/**'
      - 'scripts/current-games/**'
      - 'scripts/playtest/**'
      - 'scripts/mock-rgs-server.mjs'
      - 'services/test-server/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/button-parity.yml'
      - 'apps/lines/**'
      - 'packages/**'
      - 'scripts/button-parity/**'
      - 'scripts/current-games/**'
      - 'scripts/playtest/**'
      - 'scripts/mock-rgs-server.mjs'
      - 'services/test-server/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'

concurrency:
  group: button-parity-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  button-parity:
    name: button parity
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same shell and sandbox setup as the current-games render job (its comments say why),
      # sharing its cache.
      - name: Key the headless shell cache
        id: shell
        run: echo "key=$(scripts/current-games/headless-shell.sh key)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: .cache/headless-shell
          key: ${{ steps.shell.outputs.key }}

      - name: Install the headless shell
        timeout-minutes: 15
        run: scripts/current-games/headless-shell.sh install .cache/headless-shell button-parity

      - name: Let the headless shell start its sandbox
        run: |
          f=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$f" ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi

      - name: button parity
        run: pnpm check:button-parity

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: button-parity
          path: |
            .cache/button-parity/report.json
            .cache/button-parity/*/*/*.png
            .cache/button-parity/*/diff-*.png
          if-no-files-found: ignore
