# Lint gate — fail a PR that introduces a NEW eslint violation.
#
# WHY THIS EXISTS: `pnpm lint` was dead in every workspace for a long time (the shared config was
# still eslintrc-shaped, so ESLint 9 refused to start). Nothing caught the drift, and code rotted
# unnoticed — a component survived a refactor partly because nothing could lint it.
#
# HOW THE GATE WORKS: the repo carries ~277 pre-existing violations. Rather than weaken rules to
# get to green, they are recorded in `eslint-suppressions.json`. Every rule stays at `error`, so
# any violation NOT in that baseline fails this job. Existing debt is burned down over time by
# deleting entries from the baseline.
#
# Working on the debt:
#   pnpm exec eslint apps packages services --suppressed-only   # what is still baselined
#   pnpm exec eslint apps packages services --prune-suppressions # drop entries you have fixed
#
# READING A FAILURE: a baseline entry is a COUNT per file+rule, not a set of lines. The moment a
# file exceeds its count, ESLint cannot tell the new violation from the old ones, so it reports
# ALL of them. One added `<a href>` in `symbols/+page.svelte` (baseline 4) printed five errors and
# read like a five-fold regression. Diff the count against the baseline before you believe the
# number.
#
# NOT EVERY RULE IS FIXABLE TODAY. `svelte/no-navigation-without-resolve` is satisfied ONLY by
# `resolve()` from `$app/paths`, which landed in SvelteKit 2.26; the launcher is on 2.17.3. Its ~48
# baselined hits are therefore not debt anyone can pay per-file — they clear in one pass when Kit
# is upgraded, and until then a new internal link legitimately bumps the count.
#
# NOTE: the gate is the ROOT run (`pnpm lint`), not `turbo run lint`. Bulk suppressions resolve
# paths relative to the invocation directory, so the baseline only applies from the repo root.
# `pnpm lint:workspaces` still runs the per-package scripts, which report the raw, un-baselined
# counts — useful for burn-down, not for gating.

name: Lint

# `eslint` is a REQUIRED status check on `main` (docs/INFRA.md "Branch ruleset on main"), so it
# runs on EVERY PR and push. It used paths-ignore for docs, but a required check skipped that way
# never reports and a docs-only PR waits on it forever. Instead the first step after checkout
# (`.github/actions/code-changed`) skips the rest on a docs-only change: none of the gates below
# reads Markdown, so the job passes in seconds without installing anything (47 of August 2026's
# 420 commits to main were docs-only). Renaming the job renames the required check: update the
# ruleset in the same change, or every PR blocks.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lint-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  eslint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - id: changes
        uses: ./.github/actions/code-changed

      - if: steps.changes.outputs.code == 'true'
        uses: pnpm/action-setup@v5

      - if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - if: steps.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      - name: eslint
        if: steps.changes.outputs.code == 'true'
        run: pnpm lint

      # Undefined-identifier gate — the ONE type error a `vite build` can never catch. An app's
      # `build` is a bare `vite build`, and esbuild transpiles per file without type-checking, so
      # #373 shipped a renamed-away identifier to every online game and killed the first free spin
      # of every Book-of round. eslint could not help: typescript-eslint leaves `no-undef` off
      # because it defers to the compiler, and nothing here ran the compiler.
      #
      # Deliberately narrow (see the script header): `tsc --noResolve`, reporting only
      # TS2304/TS2552/TS18004. That scope is what makes it need no baseline — the repo is clean
      # under this rule today, so any hit is new and real. A FULL type-check is still owed;
      # `docs/status/engine.md` records the debt it would have to clear first.
      - name: no undefined identifiers
        if: steps.changes.outputs.code == 'true'
        run: pnpm check:undefined-names

      # Generated-fixture gate. `apps/lines/src/game/emitterVocabulary.ts` and the launcher's
      # `emitterVocabularies.ts` are codegen output ("GENERATED — do not edit"), derived from the
      # game's emitter union + flowEffects catalog. Nothing enforced that, and the drift is silent
      # by construction: the palette simply offers fewer cues than the game broadcasts, which looks
      # like a missing feature rather than a stale file.
      #
      # It went stale for four commits once — #355 moved `EmitterEventTransition` into a workspace
      # package, the generator could not resolve a bare specifier and threw, and because nobody runs
      # a generator that has no gate, three real entries stayed missing from the palette until #361
      # regenerated it. This is that gate.
      - name: flow vocabulary is up to date
        if: steps.changes.outputs.code == 'true'
        run: node scripts/gen-flow-vocabulary.mjs --check

      # RGS gate — the client and the server must agree about MONEY, for all four win models.
      #
      # `check:ways` already existed and was never wired here; `cluster` and `scatter` shipped with
      # no gate at all, and NOTHING asserted the stake itself. That is precisely where two bugs sat
      # unnoticed: the facade declared a hardcoded 5 paylines while the shared `lines` config
      # authors 20, so every win counted up to a QUARTER of the multiplier the wallet credited; and
      # a paylines-less model had 13 phantom lines regenerated for it, mispricing ways and cluster.
      #
      # `check:stake` drives the REAL facade against the REAL mock (see scripts/ts-loader.mjs for
      # why a plain node script can now import the TS source) and asserts the one invariant that
      # only holds when both halves agree: finalWin ÷ 100 === round.payoutMultiplier.
      - name: rgs win models agree on money
        if: steps.changes.outputs.code == 'true'
        run: pnpm check:rgs

      # Paytable + info-page figures — the import/partner-reference/drift contract `/config` and the
      # publish gate rely on, and the RTP / max-win rules copy every online game renders.
      - name: paytable and info-page figures
        if: steps.changes.outputs.code == 'true'
        run: pnpm check:paytable && pnpm check:info-figures

      # Engine-game fixture gate — the win presentation's tap / hold / outro timeline and its
      # wiring, much of it asserted against SOURCE TEXT because a Svelte template cannot be run
      # from Node. Nothing ran these: #692 moved the celebration-lock rule into its own module,
      # `winTapLand.fixture.ts` went red on `main`, and it stayed red for 12 days until someone
      # happened to run it. The runner discovers every `*.fixture.ts` in the directory, so a new
      # fixture is gated without editing this file.
      - name: engine-game fixtures pass
        if: steps.changes.outputs.code == 'true'
        run: pnpm check:engine-game

      # Launcher authorization gate. A gate that quietly stops refusing is invisible until someone
      # hits it: the `?project=` authoring APIs resolved ANY project for anyone holding the tool,
      # and the publish chain once refused every publisher the owner had granted. `launcher-gates`
      # asserts the decisions over the real role matrix and scans every `src/routes/api` handler
      # for the two shapes that caused those; `project-scope` runs the real `requireProjectScope`
      # and `lease-scope` the real `POST /api/lease`, each with only the database stubbed;
      # `deploy-read` runs the real path-form asset route, which every online game loads through, and
      # pins that it serves the project's OWN client tree. All four need `svelte-kit sync`, which
      # their `pre` scripts run. `event-bound-flags` fails on `onclick={save}` where `save(force = false)`
      # — the click event arrives as `force`, and every manual Save skips the conflict check.
      # `toolbar-icons` fails when an online tool is missing from one of the four hand-copied
      # tool-bar icon maps (rigger/spine view.html, atlas/sheet tool) — it renders iconless there.
      - name: launcher gates hold
        if: steps.changes.outputs.code == 'true'
        run: pnpm --filter launcher-api check:launcher-gates && pnpm --filter launcher-api check:project-scope && pnpm --filter launcher-api check:lease-scope && pnpm --filter launcher-api check:deploy-read && pnpm --filter launcher-api check:mock-contract && pnpm --filter launcher-api check:event-bound-flags && pnpm --filter launcher-api check:tool-launch-token && pnpm check:toolbar-icons
