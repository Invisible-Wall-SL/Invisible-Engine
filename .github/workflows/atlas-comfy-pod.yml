name: Build Atlas ComfyUI R&D pod

# Builds the INTERACTIVE ComfyUI R&D pod image and pushes it to GHCR.
# RunPod pods deploy FROM ghcr.io/invisible-wall-sl/atlas-comfy-pod:latest (public image,
# no pull creds). Distinct from atlas-comfy-worker.yml (the headless serverless worker).
on:
  push:
    branches: [main, serverless-comfyui]
    paths:
      - services/atlas-comfy-pod/**
      - .github/workflows/atlas-comfy-pod.yml
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # A CUDA image (torch + ComfyUI + insightface) overruns the runner's ~14 GB
      # disk. Reclaim ~25 GB of preinstalled toolchains we don't use.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/atlas-comfy-pod
          push: true
          tags: |
            ghcr.io/invisible-wall-sl/atlas-comfy-pod:latest
            ghcr.io/invisible-wall-sl/atlas-comfy-pod:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
