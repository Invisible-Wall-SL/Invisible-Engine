name: Build Atlas ComfyUI R&D pod

# Builds the INTERACTIVE ComfyUI R&D pod image and pushes it to GHCR.
# RunPod pods deploy FROM ghcr.io/invisible-wall-sl/atlas-comfy-pod:latest (public image,
# no pull creds). Distinct from atlas-comfy-worker.yml (the headless serverless worker).
on:
  push:
    # main only. Rebuilding this image on every push to a dev branch cost real minutes for
    # an image nothing deploys from yet; `workflow_dispatch` still builds any branch on demand.
    branches: [main]
    paths:
      - services/atlas-comfy-pod/**
      - .github/workflows/atlas-comfy-pod.yml
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # A CUDA image (torch + ComfyUI + insightface) overruns the runner's ~14 GB
      # disk. Reclaim ~25 GB of preinstalled toolchains we don't use.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Short sha
        id: shortsha
        run: echo "short=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/atlas-comfy-pod
          push: true
          # Both forms of the sha. The full one is the canonical immutable tag; the 12-char
          # one exists because humans (and /comfyui, once) abbreviate a sha, and a tag that
          # does not exist in GHCR fails a pod with `manifest unknown` at create time.
          tags: |
            ghcr.io/invisible-wall-sl/atlas-comfy-pod:latest
            ghcr.io/invisible-wall-sl/atlas-comfy-pod:${{ github.sha }}
            ghcr.io/invisible-wall-sl/atlas-comfy-pod:${{ steps.shortsha.outputs.short }}
          # Registry cache with mode=max — NOT `type=gha,mode=min`. `min` caches only the
          # FINAL layer, so every rebuild re-ran the multi-GB torch/ComfyUI/insightface pip
          # steps from cold (~21 min a build; these two image workflows alone burned a quarter
          # of August's Actions minutes and helped exhaust the free allowance). GHA cache is
          # capped at 10 GB/repo besides, which a CUDA image blows straight through, so even
          # that one layer thrashed. GHCR has no cap and is readable from every branch.
          # `image-manifest`/`oci-mediatypes` are what GHCR needs to accept a cache manifest.
          cache-from: type=registry,ref=ghcr.io/invisible-wall-sl/atlas-comfy-pod:buildcache
          cache-to: type=registry,ref=ghcr.io/invisible-wall-sl/atlas-comfy-pod:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
