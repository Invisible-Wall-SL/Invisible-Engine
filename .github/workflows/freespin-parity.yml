# The authored free-spin intro / outro vs the coded ones, frame for frame (Rive plan Phase 8c,
# §13.7.6): builds the `lines` runtime the way the release does and renders every variant on both
# sides in the headless shell (`scripts/freespin-parity/run.mjs`, `pnpm check:freespin-parity`). Its
# own workflow, as `transition-parity.yml` and `win-parity.yml` are: the Checks shards have no build,
# and the current-games verdict treats every workflow file as harness, so it lives apart from the
# runtime change it proves (#1231 and its follow-up).
#
# ADVISORY: not in the required checks (docs/INFRA.md, "Required checks"); the owner decides whether
# it joins them. Path-filtered like its twins: it runs only when something it measures can change
# (the runtime, the shared packages, the harness libraries it borrows, the mock RGS, the lockfile)
# or this file itself. Four variants of a
# whole free-spin round on two sides take about 40 minutes, hence the 90-minute ceiling.

name: Free-spin parity

on:
  pull_request:
    paths:
      - '.github/workflows/freespin-parity.yml'
      - 'apps/lines/**'
      - 'packages/**'
      - 'scripts/freespin-parity/**'
      - 'scripts/current-games/**'
      - 'scripts/playtest/**'
      - 'scripts/mock-rgs-server.mjs'
      - 'services/test-server/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/freespin-parity.yml'
      - 'apps/lines/**'
      - 'packages/**'
      - 'scripts/freespin-parity/**'
      - 'scripts/current-games/**'
      - 'scripts/playtest/**'
      - 'scripts/mock-rgs-server.mjs'
      - 'services/test-server/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'

concurrency:
  group: freespin-parity-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freespin-parity:
    name: free-spin parity
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same shell and sandbox setup as the current-games render job (its comments say why),
      # sharing its cache.
      - name: Key the headless shell cache
        id: shell
        run: echo "key=$(scripts/current-games/headless-shell.sh key)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: .cache/headless-shell
          key: ${{ steps.shell.outputs.key }}

      - name: Install the headless shell
        timeout-minutes: 15
        run: scripts/current-games/headless-shell.sh install .cache/headless-shell freespin-parity

      - name: Let the headless shell start its sandbox
        run: |
          f=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$f" ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi

      - name: free-spin parity
        run: pnpm check:freespin-parity

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: freespin-parity
          path: |
            .cache/freespin-parity/report.json
            .cache/freespin-parity/*/*/*-t+*.png
            .cache/freespin-parity/*/diff-*.png
          if-no-files-found: ignore
