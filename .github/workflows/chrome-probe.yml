# TEMPORARY (removed before merge): is Chrome's slow first launch the first read of its install?
name: Chrome probe

on:
  pull_request:

jobs:
  preread:
    name: pre-read (${{ matrix.pre }} ${{ matrix.i }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        i: [1, 2, 3]
        pre: [read, none]
    steps:
      - uses: actions/checkout@v7
      - run: du -sh /opt/google/chrome
      - if: matrix.pre == 'read'
        run: |
          s=$(date +%s%N); find /opt/google/chrome -type f -exec cat {} + > /dev/null; echo "cold read: $(( ($(date +%s%N) - s) / 1000000 )) ms"
          s=$(date +%s%N); find /opt/google/chrome -type f -exec cat {} + > /dev/null; echo "warm read: $(( ($(date +%s%N) - s) / 1000000 )) ms"
      - run: CHROME_PATH="$(command -v google-chrome)" node .github/chrome-probe/old-launch.mjs 3
