# TEMPORARY (removed before merge): what Chrome's first launch on a fresh runner waits on.
name: Chrome probe

on:
  pull_request:

jobs:
  trace:
    name: trace first launch (${{ matrix.i }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        i: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get install -y strace > /dev/null 2>&1 || true
      - run: bash .github/chrome-probe/trace-first.sh
