# TEMPORARY (removed before merge): measure the old Chrome launch and loop the new one on the runner.
name: Chrome probe

on:
  pull_request:

jobs:
  old-launch:
    name: old launch (${{ matrix.mode }} ${{ matrix.i }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        i: [1, 2]
        mode: ['--cold', '--cold --io', '--io --load']
    steps:
      - uses: actions/checkout@v7
      - run: google-chrome --version
      - run: CHROME_PATH="$(command -v google-chrome)" node .github/chrome-probe/old-launch.mjs 10 ${{ matrix.mode }}

  mutants:
    name: mutants
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash .github/chrome-probe/mutants.sh

  new-helper:
    name: new helper (${{ matrix.i }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        i: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: CHROME_PATH="$(command -v google-chrome)" node .github/chrome-probe/spike-loop.mjs 6 5
