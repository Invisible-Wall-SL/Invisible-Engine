# Offline checks — every fixture, verify/check script, headless spike and Python test in the repo.
#
# WHY THIS EXISTS: Lint ran a handful of gates; the other ~200 checks, each with a `Run:` line in its
# header, ran only when someone remembered. They decayed silently — six flow spikes and an
# engine-layout test sat red on `main` as "known reds" until nobody could tell a new failure from an
# old one. Both runners DISCOVER their checks, so a new fixture or test is gated the day it lands,
# and every deliberate skip carries its reason in the runner (`pnpm check:all --list`).
#
#   check-all (n/3)  → `scripts/check-all.mjs`, sharded because the suite is ~15 CPU-minutes.
#                      `--exclude-lint` drops what Lint already runs (read from lint.yml), so no gate
#                      runs twice and none falls between the two.
#   python tests     → `scripts/check-python.py`: every services/*/test_*.py, the ComfyUI node suite
#                      (CPU torch), and the backup job's CLI. No secrets exist here, and the runner
#                      scrubs them locally too, so a test cannot reach R2 or a real ComfyUI.
#
# REQUIRED CHECKS: every job name here is a required status check on `main` (docs/INFRA.md
# "Branch ruleset on main"), so the workflow runs on EVERY PR and push — no paths-ignore, which
# would leave a docs-only PR waiting forever on a check that never reports. Each job's first step
# after checkout (`.github/actions/code-changed`) skips the rest on a docs-only change, so those
# still pass in seconds without installing anything. Renaming a job or the matrix renames the
# required check: update the ruleset in the same change, or every PR blocks.

name: Checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check-all:
    name: check-all (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - id: changes
        uses: ./.github/actions/code-changed

      - if: steps.changes.outputs.code == 'true'
        uses: pnpm/action-setup@v6

      - if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - if: steps.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      # The Rigger's text spikes drive a real headless browser; the runner image ships Chrome.
      - name: offline checks
        if: steps.changes.outputs.code == 'true'
        run: CHROME_PATH="$(command -v google-chrome)" pnpm check:all --exclude-lint --shard ${{ matrix.shard }}/3 --jobs 4

  python:
    name: python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - id: changes
        uses: ./.github/actions/code-changed

      - if: steps.changes.outputs.code == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            services/atlas-tool/requirements.txt
            services/sheet-tool/requirements.txt
            scripts/backup/requirements.txt

      # The backup job's pins are hash-checked, so they go in on their own; the services' floors
      # (boto3>=…) are then already satisfied by those exact pins.
      - name: install
        if: steps.changes.outputs.code == 'true'
        run: |
          python -m pip install --require-hashes -r scripts/backup/requirements.txt
          python -m pip install -r services/atlas-tool/requirements.txt -r services/sheet-tool/requirements.txt requests numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: python tests
        if: steps.changes.outputs.code == 'true'
        run: python scripts/check-python.py
