# Secret scan — the server-side backstop for the pre-commit hook.
#
# The hook (scripts/git-hooks/pre-commit → scripts/check-secrets.mjs) only runs in a clone that
# enabled `core.hooksPath`, and `git commit --no-verify` skips it. This job runs the SAME scanner
# over the lines a PR (or a direct push to main) ADDS, so a secret that slipped past a local
# commit is caught before it merges. It prints file, line and secret TYPE only — never the value —
# because a public repo's Actions log is public too.
#
# Deliberately NO paths-ignore: a docs change can paste a token as easily as code can, and the
# job is a few seconds of plain Node with no install.

name: Secrets

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: secrets-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: scanner fixtures pass
        run: node scripts/check-secrets.test.mjs

      - name: no secrets in the PR's added lines
        if: github.event_name == 'pull_request'
        run: node scripts/check-secrets.mjs --diff "origin/${{ github.base_ref }}"

      # A force-push can leave `before` unreachable; fall back to the pushed commit alone.
      - name: no secrets in the pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            node scripts/check-secrets.mjs --diff "$BEFORE..HEAD"
          else
            node scripts/check-secrets.mjs --diff "HEAD~1..HEAD"
          fi
