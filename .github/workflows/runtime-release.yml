# Runtime release — build the shared engine bundle and publish it to `_runtime/<id>`.
#
# WHY THIS EXISTS: online games do NOT run their own build; they run the SHARED engine bundle at
# `test_server/_runtime/<id>/` (Game Maker's Publish only POINTS a game at it — it never rebuilds
# it). So an engine change reaches a live game ONLY through this release. It used to require the
# R2 keys on a developer's machine; running it here means the keys live in GitHub's encrypted
# secrets and a release is a button, not a local shell.
#
# AUTOMATIC on merge — a `push` to `main` that touches the engine (`apps/lines/**` or `packages/**`)
# auto-builds + publishes the `lines` runtime, so a merged engine fix reaches the online games with
# no extra step. Still `workflow_dispatch` too, for a manual release or to publish a different
# runtime id. Note the blast radius: a release re-points EVERY online game on that runtime at the new
# engine code, so an unverified engine commit on `main` goes live to all of them.
#
# One-time setup — add these under Settings → Secrets and variables → Actions:
#   R2_ENDPOINT, R2_BUCKET, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY   (Railway → Invisible launcher
#   → production → Variables), plus TEST_SERVER_SECRET only if the test server sets one.

name: Runtime release

on:
  # Auto-release the `lines` runtime whenever engine code merges to main. Path-filtered so a
  # docs/launcher-only merge doesn't trigger a pointless rebuild.
  push:
    branches: [main]
    paths:
      - 'apps/lines/**'
      - 'packages/**'
  workflow_dispatch:
    inputs:
      runtime:
        description: 'Runtime id to publish (built from apps/<id>)'
        type: string
        default: 'lines'
        required: true
      refresh:
        description: 'POST /refresh so the test server re-hydrates immediately'
        type: boolean
        default: true

concurrency:
  # `inputs.runtime` is empty on a push event → fall back to 'lines' so a push- and a dispatch-
  # triggered release for the same runtime still serialize into one group.
  group: runtime-release-${{ inputs.runtime || 'lines' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One knob both triggers read: the dispatched runtime id, or 'lines' for an auto push-release.
    env:
      RUNTIME: ${{ inputs.runtime || 'lines' }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Advisory: mark the runtime as "building" BEFORE the (multi-minute) build so the launcher can
      # show "Releasing engine…" while it runs. `continue-on-error` — the stamp must never fail a
      # release; the final `released` stamp (after upload) is the one that matters.
      - name: Stamp release as building
        continue-on-error: true
        env:
          GITHUB_SHA: ${{ github.sha }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          node apps/launcher-api/scripts/publish-runtime-bundle.mjs \
            "${{ env.RUNTIME }}" --status building

      # The workspace `dist` outputs the game build consumes are NOT rebuilt by the app's own vite
      # build — a stale dist silently ships old engine code (the "stale engine dist" trap).
      - name: Build workspace packages
        run: pnpm --filter "${{ env.RUNTIME }}^..." build

      # PUBLIC_RGS_TRANSPORT=play4fun is REQUIRED: the test server's mock RGS speaks Play4Fun, and a
      # bundle built without it never completes the handshake and hangs on a blank loading screen.
      - name: Build the ${{ env.RUNTIME }} runtime
        env:
          PUBLIC_RGS_TRANSPORT: play4fun
        run: pnpm --filter ${{ env.RUNTIME }} build

      - name: Publish to _runtime/${{ env.RUNTIME }}
        env:
          GITHUB_SHA: ${{ github.sha }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          node apps/launcher-api/scripts/publish-runtime-bundle.mjs \
            "${{ env.RUNTIME }}" "apps/${{ env.RUNTIME }}/build"

      # The test server hydrates every bundle from R2 on boot; this pokes it to re-hydrate NOW instead
      # of on its next lazy refresh. It answers 202 immediately and hydrates in the background.
      #
      # BEST-EFFORT, NEVER FATAL: by this point the bundle is uploaded AND the release is stamped
      # `released` (the Publish step above), so the release has already SUCCEEDED. This endpoint 502s
      # while the server is mid-rehydrate (it flaps as it reloads), so we retry with backoff to ride
      # that window out — but if it still won't take we WARN and exit 0. Failing the whole job on a
      # cache poke made a green release read as a broken publish (and hid that the engine actually
      # shipped). DO NOT SHORTEN THE LADDER TO SAVE CI MINUTES: it looks like idle sleeping (~93s
      # a run, the single most expensive step in this repo’s CI) but it is the ONLY thing that
      # makes a published bundle visible. services/test-server/server.mjs calls hydrate() from
      # exactly two places — this endpoint and boot — so there is NO timer and NO lazy re-hydrate.
      # If every attempt 502s the bundle sits in R2 and every online game keeps serving the OLD
      # engine until someone redeploys the server or POSTs /refresh by hand, while this job
      # stays GREEN.
      - name: Refresh the test server
        # Auto push-releases always refresh; a manual dispatch honours its refresh checkbox.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.refresh }}
        env:
          TEST_SERVER_SECRET: ${{ secrets.TEST_SERVER_SECRET }}
        run: |
          url="https://games.invisiblewall.org/refresh"
          if [ -n "$TEST_SERVER_SECRET" ]; then url="$url?secret=$TEST_SERVER_SECRET"; fi
          # 9 attempts over ~4.5 min (sleep BEFORE all but the first), backing off to ride out a
          # Railway restart / rehydrate window. `-m 25` so a hung socket during reload can't stall.
          attempt=0
          for wait in 0 10 15 20 30 30 45 45 60; do
            [ "$wait" -gt 0 ] && sleep "$wait"
            attempt=$((attempt + 1))
            code=$(curl -sS -m 25 -o /dev/stderr -w '%{http_code}' -X POST "$url" || echo 000)
            echo "refresh attempt $attempt → HTTP $code"
            case "$code" in 200|202) echo "refreshed"; exit 0 ;; esac
          done
          echo "::warning title=Test server refresh did not take::Runtime bundle IS published and the release is stamped, but the test server did NOT pick it up and will NOT re-hydrate on its own — online games keep serving the previous engine until someone POSTs /refresh or the server redeploys. Not failing the release."
          exit 0
