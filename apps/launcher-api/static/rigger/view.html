// Export the (edited) skeleton as `.irig` — byte-valid Spine 4.2 JSON under our
// extension. In-place edits to rawDoc are preserved verbatim (incl. animations).
function exportIrig(){
  if (!rawDoc) return;
  const stem = (selected && selected.skeleton_file ? selected.skeleton_file : "skeleton").replace(/\.[^.]+$/, "");
  const blob = new Blob([JSON.stringify(rawDoc)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = stem + ".irig";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// Save edits to the project in R2 as <stem>.irig (server rebuilds the skeleton
// index so it re-appears in the list). Non-destructive — the source .json stays.
async function saveToR2(){
  if (!rawDoc || !selected) return;
  const stem = (selected.skeleton_file || "skeleton").replace(/\.[^.]+$/, "");
  const btn = $("#saveBtn"); const label = btn.textContent;
  btn.disabled = true; btn.textContent = "saving…";
  clearErr();
  try {
    const r = await fetch("/api/rigger/save", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ dir: selected.dir_b64, stem, skeleton: rawDoc }),
    });
    if (!r.ok) throw new Error((await r.text()) || ("HTTP " + r.status));
    await r.json();
    dirty = false; $("#resetBtn").disabled = true;
    btn.textContent = "✓ saved";
    setTimeout(() => { btn.textContent = label; btn.disabled = !rawDoc; }, 1500);
    loadSkeletons(true); // refresh list so the new <stem>.irig appears
  } catch (e){
    showErr("Save failed: " + (e.message || e));
    btn.textContent = label; btn.disabled = !rawDoc;
  }
}

// Names of every bone whose parent chain passes through `boneName` (its subtree) —
// used to forbid reparenting onto a descendant (would create a cycle).
function descendantNames(boneName){
  const set = new Set();
  skeletonData.bones.forEach((b) => {
    for (let p = b.parent; p; p = p.parent){ if (p.name === boneName){ set.add(b.name); break; } }
  });
  return set;
}

// Spine requires a bone's parent to be defined BEFORE it in the JSON `bones` array.
// Reorder so every parent precedes its children (stable depth-first from roots).
function topoSortBones(doc){
  const byName = new Map(doc.bones.map((b) => [b.name, b]));
  const out = [], seen = new Set();
  const visit = (b) => {
    if (!b || seen.has(b.name)) return;
    seen.add(b.name);
    const p = b.parent && byName.get(b.parent);
    if (p) visit(p);
    out.push(b);
  };
  doc.bones.forEach(visit);
  doc.bones = out;
}

// Re-read skeletonData from the edited rawDoc using the already-loaded atlas, then
// rebuild the runtime skeleton + anim state (needed after a STRUCTURAL edit like
// reparent). Pass a CLONE so the loader never mutates our editable source. Restores
// the active skin + the selected bone by name.
function rebuildFromRawDoc(selName){
  const atlas = assetMgr.require(selected.atlas_file);
  const sj = new SPINE.SkeletonJson(new SPINE.AtlasAttachmentLoader(atlas));
  skeletonData = sj.readSkeletonData(JSON.parse(JSON.stringify(rawDoc)));
  skeleton = new SPINE.Skeleton(skeletonData);
  animState = new SPINE.AnimationState(new SPINE.AnimationStateData(skeletonData));
  if (skeletonData.skins.length){
    const want = $("#skin").value;
    const def = skeletonData.skins.find((s) => s.name === want)
      || skeletonData.skins.find((s) => s.name === "default") || skeletonData.skins[0];
    skeleton.setSkinByName(def.name);
  }
  skeleton.setToSetupPose();
  updateWorld();
  buildInspector(selected);
  const idx = selName != null ? skeletonData.bones.findIndex((b) => b.name === selName) : -1;
  selBone = idx >= 0 ? idx : null;
  if (selBone != null) selectBone(selBone); else renderBoneDetail();
}

// Change a bone's parent (structural) → mutate rawDoc + topo-sort + rebuild.
function reparentBone(i, newParentName){
  if (!rawDoc) return;
  const bd = skeletonData.bones[i];
  if (newParentName === bd.name) return;
  if (descendantNames(bd.name).has(newParentName)) return; // would create a cycle
  const rb = rawDoc.bones.find((b) => b.name === bd.name);
  if (!rb) return;
  if (newParentName) rb.parent = newParentName; else delete rb.parent;
  topoSortBones(rawDoc);
  rebuildFromRawDoc(bd.name);
  markDirty();
}

// Drag the selected bone in the viewport: screen delta → world delta → parent-local
// delta (inverse of the parent's world matrix), added to the bone's local x/y.
function moveSelectedBoneByScreen(dxScreen, dyScreen, dpr){
  if (selBone == null || !rawDoc) return;
  const zoom = renderer.camera.zoom;
  const worldDX = dxScreen * dpr * zoom;
  const worldDY = -dyScreen * dpr * zoom;
  const p = skeleton.bones[selBone].parent;
  let lx = worldDX, ly = worldDY;
  if (p){
    const det = p.a * p.d - p.b * p.c;
    if (Math.abs(det) > 1e-8){
      lx = (p.d * worldDX - p.b * worldDY) / det;
      ly = (p.a * worldDY - p.c * worldDX) / det;
    }
  }
  const bd = skeletonData.bones[selBone];
  bd.x += lx; bd.y += ly;
  const rb = rawDoc.bones.find((b) => b.name === bd.name);
  if (rb){ rb.x = bd.x; rb.y = bd.y; }
  skeleton.setToSetupPose();
  updateWorld();
  markDirty();
}

// Discard ALL edits (transforms + structure): restore rawDoc from the untouched
// original and rebuild.
function resetEdits(){
  if (!rawDocOriginal) return;
  const selName = selBone != null ? skeletonData.bones[selBone].name : null;
  rawDoc = JSON.parse(JSON.stringify(rawDocOriginal));
  rebuildFromRawDoc(selName);
  dirty = false;
  $("#resetBtn").disabled = true;
}

// 2D marker over the selected bone's world origin (defensive — never breaks render)
function updateBoneMarker(){
  const mk = $("#bonemark");
  if (selBone == null || !skeleton || !renderer){ mk.style.display = "none"; return; }
  try {
    const bw = skeleton.bones[selBone];
    const cv = $("#cv"), dpr = window.devicePixelRatio || 1;
    const v = new SPINE.Vector3(bw.worldX, bw.worldY, 0);
    renderer.camera.worldToScreen(v, cv.width, cv.height); // -> device px, y-up
    mk.style.left = (v.x / dpr) + "px";
    mk.style.top = (cv.clientHeight - v.y / dpr) + "px";
    mk.style.display = "block";
  } catch (e){ mk.style.display = "none"; }
}

// ---- camera / fit ---------------------------------------------------------
function fitView(){
  if (!skeleton) return;
  const off = new SPINE.Vector2(), size = new SPINE.Vector2();
  skeleton.getBounds(off, size, []);
  const cam = renderer.camera;
  resizeCanvas();
  if (size.x > 0 && size.y > 0){
    cam.position.x = off.x + size.x/2;
    cam.position.y = off.y + size.y/2;
    const vw = $("#cv").width, vh = $("#cv").height;
    cam.zoom = Math.max(size.x/vw, size.y/vh) * 1.25;
  }
  cam.update();
}

// ---- render loop ----------------------------------------------------------
function frame(now){
  requestAnimationFrame(frame);
  const delta = lastFrame ? (now - lastFrame)/1000 : 0; lastFrame = now;
  resizeCanvas();
  if (!renderer){ return; }
  const cv = $("#cv");
  renderer.camera.viewportWidth = cv.width;
  renderer.camera.viewportHeight = cv.height;
  renderer.camera.update();
  gl.clearColor(bgColor.r, bgColor.g, bgColor.b, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.viewport(0, 0, cv.width, cv.height);

  if (skeleton && animState){
    // In edit mode we hold the (edited) setup pose — skip animation so edits stay visible.
    if (!editMode){
      if (playing) animState.update(delta);
      animState.apply(skeleton);
    }
    updateWorld();
    renderer.begin();
    renderer.drawSkeleton(skeleton, pma);
    if (showBones || showMesh){
      const d = renderer.skeletonDebugRenderer;
      if (d){
        d.drawBones = showBones;
        d.drawRegionAttachments = false;
        d.drawBoundingBoxes = false;
        d.drawMeshHull = showMesh;
        d.drawMeshTriangles = showMesh;
        d.drawClipping = false;
        d.drawPaths = false;
      }
      renderer.drawSkeletonDebug(skeleton, false);
    }
    drawMeshOverlay();
    drawDrawingOverlay();
    renderer.end();
    updateBoneMarker();
    syncScrub();
  }
}

function syncScrub(){
  curEntry = animState.getCurrent(0) || curEntry;
  if (!curEntry || !curEntry.animation) return;
  const dur = curEntry.animation.duration || 0.0001;
  const t = curEntry.trackTime % dur;
  $("#scrub").value = Math.round((t/dur)*1000);
  $("#time").textContent = t.toFixed(2) + "s / " + dur.toFixed(2) + "s";
}

// ---- skeleton list --------------------------------------------------------
function renderList(){
  const q = $("#filter").value.toLowerCase();
  const list = $("#list"); list.innerHTML = "";
  let shown = 0;
  skeletons.forEach(e => {
    if (q && !e.name.toLowerCase().includes(q)) return;
    shown++;
    const d = document.createElement("div");
    d.className = "item" + (selected && selected.id === e.id ? " sel" : "");
    const ext = (e.skeleton_file || "").split(".").pop();
    const fmt = ext === "irig" ? "irig · edited" : e.format;
    d.innerHTML = '<div class="nm">' + e.name + '</div>' +
      '<div class="meta">' + fmt + (e.version ? ' · ' + e.version : '') +
      '<span class="badge">rt ' + e.runtime + '</span></div>';
    d.onclick = () => selectSkeleton(e);
    const del = document.createElement("button");
    del.textContent = "🗑"; del.title = "delete this rig";
    del.style.cssText = "position:absolute;top:6px;right:6px;padding:0 6px;font-size:12px;opacity:.55;";
    del.onclick = (ev) => { ev.stopPropagation(); deleteRig(e); };
    d.style.position = "relative";
    d.appendChild(del);
    list.appendChild(d);
  });
  $("#count").textContent = "(" + shown + ")";
}

function setActiveProject(client, project){
  if (!project) return;
  $("#sub").textContent = project;
  const label = client ? client + " / " + project : project;
  const psel = $("#project"); psel.innerHTML = "";
  const o = document.createElement("option");
  o.value = project; o.textContent = label; o.selected = true;
  psel.appendChild(o);
}

async function loadSkeletons(refresh){
  $("#count").textContent = "(scanning…)";
  const r = await (await fetch("/spine/skeletons" + (refresh ? "?refresh=1" : ""))).json();
  setActiveProject(r.client, r.project);
  if (r.error){ showErr(r.error); skeletons = []; renderList(); return; }
  skeletons = r.skeletons || [];
  renderList();
  const h = new URLSearchParams(location.hash.slice(1));
  const id = h.get("id");
  if (id !== null){
    const target = skeletons.find(x => x.id === parseInt(id, 10));
    if (target){ history.replaceState(null, "", location.pathname); selectSkeleton(target); }
  }
}

async function deleteRig(e){
  if (!confirm('Delete the rig "' + e.name + '"?\n\nThis removes its skeleton file' +
    ' (and, if nothing else uses the folder, its atlas + images too). This cannot be undone.')) return;
  try {
    const r = await fetch("/api/rigger/delete", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ dir: e.dir_b64 || "", skeleton_file: e.skeleton_file }),
    });
    if (!r.ok){ showErr("Delete failed: " + r.status + " " + (await r.text())); return; }
    // if the deleted rig is the one on stage, reload to clear it (query params persist)
    if (selected && selected.id === e.id){ location.reload(); return; }
    await loadSkeletons(true);
  } catch (err){ showErr("Delete failed: " + (err && err.message ? err.message : err)); }
}

function hexToRGB(hex){
  const n = parseInt(hex.replace("#",""), 16);
  return { r:((n>>16)&255)/255, g:((n>>8)&255)/255, b:(n&255)/255, a:1 };
}

function wire(){
  $("#play").onclick = () => { playing = !playing; $("#play").textContent = playing ? "❚❚ Pause" : "▶ Play"; };
  $("#loop").onclick = () => { looping = !looping; $("#loop").classList.toggle("active", looping); if (curEntry) curEntry.loop = looping; };
  $("#anim").onchange = e => setAnim(e.target.value);
  $("#skin").onchange = e => setActiveSkin(e.target.value);
  $("#speed").oninput = e => { const v = e.target.value/100; if (animState) animState.timeScale = v; $("#speedv").textContent = v.toFixed(1) + "×"; };
  $("#scrub").oninput = e => {
    if (!curEntry || !curEntry.animation) return;
    playing = false; $("#play").textContent = "▶ Play";
    curEntry.trackTime = (e.target.value/1000)*curEntry.animation.duration;
    animState.apply(skeleton); updateWorld();
  };
  $("#filter").oninput = renderList;
  $("#rescan").onclick = () => loadSkeletons(true);
  $("#newRigBtn").onclick = async () => {
    const p = $("#newRig");
    if (p.style.display !== "none"){ p.style.display = "none"; return; }
    p.style.display = "block";
    $("#newRigNote").textContent = "loading atlases…";
    try {
      const r = await (await fetch("/api/rigger/atlases")).json();
      const sel = $("#newRigAtlas"); sel.innerHTML = "";
      (r.atlases || []).forEach((a) => {
        const o = document.createElement("option");
        o.value = a.manifestKey; o.textContent = a.label + " — " + a.regions.length + " images";
        sel.appendChild(o);
      });
      $("#newRigNote").textContent = (r.atlases && r.atlases.length)
        ? "pick an atlas to draw images from, name the rig, Create"
        : "no atlases yet — pack images in the Atlas Maker first";
    } catch (e){ $("#newRigNote").textContent = "failed to list atlases"; }
  };
  $("#newRigCancel").onclick = () => { $("#newRig").style.display = "none"; };
  $("#newRigCreate").onclick = createNewRig;
  $("#newRigFiles").onchange = (e) => { if (e.target.files && e.target.files.length) createRigFromImages(e.target.files); };
  $("#bonesBtn").onclick = () => { showBones = !showBones; $("#bonesBtn").classList.toggle("active", showBones); };
  $("#meshBtn").onclick = () => { showMesh = !showMesh; $("#meshBtn").classList.toggle("active", showMesh); };
  $("#fit").onclick = fitView;
  $("#editBtn").onclick = () => {
    setEditMode(!editMode);
    // re-render the inspector so slot ↑/↓ controls appear/disappear, then restore selections
    if (skeletonData && selected){
      buildInspector(selected);
      if (selBone != null) selectBone(selBone);
      if (selSlot) selectSlot(selSlot);
    }
  };
  $("#exportBtn").onclick = exportIrig;
  $("#saveBtn").onclick = saveToR2;
  $("#resetBtn").onclick = resetEdits;

  const cv = $("#cv");
  cv.addEventListener("wheel", e => {
    e.preventDefault();
    if (!renderer) return;
    const f = e.deltaY > 0 ? 1.1 : 0.9;
    renderer.camera.zoom = Math.max(0.01, Math.min(50, renderer.camera.zoom * f));
  }, {passive:false});
  cv.addEventListener("mousedown", e => {
    // Drawing a mesh: each click adds a boundary point.
    if (editMode && drawMeshMode && !e.shiftKey){
      const cw = cursorWorld(e);
      if (cw){ drawPoints.push({ x: cw.x, y: cw.y }); renderSlotDetail(); }
      lastXY = [e.clientX, e.clientY]; return;
    }
    // Mesh interactions (only when a mesh slot is active) — each returns only if it hits.
    if (editMode && meshCtx && !e.shiftKey){
      if (weightBrush && brushBone != null){ const cw = cursorWorld(e); if (cw){ brushPainting = true; paintDab(cw.x, cw.y); lastDabWorld = cw; } lastXY = [e.clientX, e.clientY]; return; }
      if (meshAddMode){ const cw = cursorWorld(e); if (cw) addMeshVertex(cw.x, cw.y); lastXY = [e.clientX, e.clientY]; return; }
      if (meshRemoveMode){ const k = nearestMeshVert(e); if (k >= 0) removeMeshVertex(k); lastXY = [e.clientX, e.clientY]; return; }
      if (tryStartMeshDrag(e)){ lastXY = [e.clientX, e.clientY]; return; }
    }
    // Click a bone on the canvas to select + move it.
    if (editMode && rawDoc && !e.shiftKey){
      const bi = nearestBone(e);
      if (bi >= 0){ if (selBone !== bi) selectBone(bi); boneDragging = true; lastXY = [e.clientX, e.clientY]; return; }
    }
    dragging = true;
    lastXY = [e.clientX, e.clientY];
  });
  window.addEventListener("mouseup", () => {
    brushPainting = false;
    const wasMeshDrag = meshDragVert != null;
    if (wasMeshDrag) meshDragVert = null;
    if (boneDragging){ boneDragging = false; renderBoneDetail(); } // refresh x/y inputs
    if (wasMeshDrag) renderSlotDetail(); // show the selected vertex's UV editors
    dragging = false;
  });
  window.addEventListener("mousemove", e => {
    if (!renderer || !lastXY) return;
    const dpr = window.devicePixelRatio || 1;
    const dxCss = e.clientX - lastXY[0], dyCss = e.clientY - lastXY[1];
    if (brushPainting){
      const cw = cursorWorld(e);
      if (cw){
        const rw = brushRadiusPx * renderer.camera.zoom;
        if (!lastDabWorld || Math.hypot(cw.x - lastDabWorld.x, cw.y - lastDabWorld.y) > rw * 0.4){ paintDab(cw.x, cw.y); lastDabWorld = cw; }
      }
      lastXY = [e.clientX, e.clientY];
    } else if (meshDragVert != null){
      const cw = cursorWorld(e), w = meshWorldVerts();
      if (cw && w){ const k = meshDragVert; applyMeshVertexDelta(k, cw.x - w[k * 2], cw.y - w[k * 2 + 1]); }
      lastXY = [e.clientX, e.clientY];
    } else if (boneDragging){
      moveSelectedBoneByScreen(dxCss, dyCss, dpr);
      lastXY = [e.clientX, e.clientY];
    } else if (dragging){
      renderer.camera.position.x -= dxCss * dpr * renderer.camera.zoom;
      renderer.camera.position.y += dyCss * dpr * renderer.camera.zoom;
      lastXY = [e.clientX, e.clientY];
    }
  });
}

async function boot(){
  wire();
  const h = new URLSearchParams(location.hash.slice(1));
  const rt = h.get("rt");
  if (rt){ try { await loadRuntime(rt); initGL(); } catch(e){ showErr(String(e)); } }
  await loadSkeletons(false);
  requestAnimationFrame(frame);
}
boot();
</script>
