<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invisible Rigger</title>
<style>
  :root {
    --bg:#1b1d22; --panel:#23262d; --panel2:#2b2f38; --line:#363b45;
    --txt:#d7dbe2; --dim:#8b93a1; --accent:#5db0ff; --accent2:#7ee0c0;
    --danger:#ff7a7a;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt);
    font:13px/1.4 "Segoe UI",system-ui,sans-serif; }
  body { display:flex; flex-direction:column; }
  #app { display:flex; flex:1; min-height:0; }
  /* unified tool bar — mirrors the launcher $lib/ToolTopBar.svelte */
  .iw-toolbar { display:flex; align-items:center; gap:16px; padding:8px 14px;
    background:var(--panel); border-bottom:1px solid var(--line); flex:0 0 auto; }
  .iw-brand { display:flex; align-items:center; gap:9px; flex:none; font-weight:700;
    letter-spacing:.14em; text-transform:uppercase; color:var(--accent2);
    font-size:14px; text-decoration:none; white-space:nowrap; }
  .iw-switcher { display:flex; align-items:center; gap:4px; min-width:0; flex:1 1 auto;
    overflow:hidden; }
  .iw-tool { display:inline-flex; align-items:center; gap:6px; flex:none; padding:5px 9px;
    border-radius:8px; border:1px solid transparent; color:#b9b9c4; text-decoration:none;
    font-size:12px; font-weight:600; white-space:nowrap; }
  .iw-tool:hover { background:var(--panel2); border-color:var(--line); color:#fff; }
  .iw-tool .ic { display:inline-flex; width:16px; height:16px; }
  .iw-tool .ic svg { width:16px; height:16px; display:block; }
  @media (max-width:1100px){ .iw-tool .label { display:none; } .iw-tool { padding:6px; } }
  /* sidebar */
  #side { width:280px; flex:0 0 280px; background:var(--panel); border-right:1px solid var(--line);
    display:flex; flex-direction:column; }
  #brand { padding:12px 14px; border-bottom:1px solid var(--line); }
  #brand b { letter-spacing:.12em; font-size:12px; color:var(--accent2); }
  #brand small { display:block; color:var(--dim); margin-top:2px; font-size:11px; }
  .row { padding:8px 14px; border-bottom:1px solid var(--line); }
  .row label { display:block; color:var(--dim); font-size:11px; margin-bottom:4px;
    text-transform:uppercase; letter-spacing:.06em; }
  select, input[type=text] { width:100%; background:var(--panel2); color:var(--txt);
    border:1px solid var(--line); border-radius:6px; padding:6px 8px; font-size:12px; }
  #filter { margin-bottom:6px; }
  #list { flex:1; overflow:auto; }
  .item { padding:7px 14px; border-bottom:1px solid #2a2e36; cursor:pointer; }
  .item:hover { background:var(--panel2); }
  .item.sel { background:#2f3a48; border-left:3px solid var(--accent); padding-left:11px; }
  .item .nm { font-size:12px; word-break:break-all; }
  .item .meta { color:var(--dim); font-size:10px; margin-top:2px; }
  .badge { display:inline-block; background:#384150; color:var(--accent2);
    border-radius:4px; padding:0 5px; font-size:10px; margin-left:4px; }
  /* main */
  #main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #stage { flex:1; position:relative; overflow:hidden; }
  canvas { width:100%; height:100%; display:block; }
  #bonemark { position:absolute; width:10px; height:10px; margin:-5px 0 0 -5px; border-radius:50%;
    border:2px solid var(--accent2); background:rgba(126,224,192,.25); pointer-events:none;
    display:none; box-shadow:0 0 0 1px #000; }
  #hint { position:absolute; left:12px; top:10px; color:var(--dim); font-size:11px;
    pointer-events:none; text-shadow:0 1px 2px #000; }
  #err { position:absolute; left:12px; right:12px; top:10px; background:#3a2326;
    border:1px solid var(--danger); color:#ffd4d4; padding:8px 10px; border-radius:6px;
    font-size:12px; display:none; white-space:pre-wrap; }
  /* controls bar */
  #bar { background:var(--panel); border-top:1px solid var(--line); padding:8px 12px;
    display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  #bar .grp { display:flex; gap:6px; align-items:center; }
  #bar label { color:var(--dim); font-size:11px; }
  button { background:var(--panel2); color:var(--txt); border:1px solid var(--line);
    border-radius:6px; padding:6px 10px; cursor:pointer; font-size:12px; }
  button:hover { border-color:var(--accent); }
  button.active { background:#2f3a48; border-color:var(--accent); color:#fff; }
  #scrub { flex:1; min-width:140px; }
  #speed { width:90px; }
  .pill { color:var(--dim); font-size:11px; }
  input[type=color] { width:34px; height:26px; padding:0; border:1px solid var(--line);
    background:var(--panel2); border-radius:5px; }
  /* inspector (right) */
  #inspector { width:320px; flex:0 0 320px; background:var(--panel); border-left:1px solid var(--line);
    display:flex; flex-direction:column; overflow:auto; }
  #insHead { padding:10px 14px; border-bottom:1px solid var(--line); }
  #insHead b { letter-spacing:.1em; font-size:11px; color:var(--accent2); text-transform:uppercase; }
  #insHead small { display:block; color:var(--dim); font-size:11px; margin-top:3px; }
  details.sec { border-bottom:1px solid var(--line); }
  details.sec > summary { padding:8px 14px; cursor:pointer; color:var(--dim);
    font-size:11px; text-transform:uppercase; letter-spacing:.06em; user-select:none; }
  details.sec > summary::marker { color:var(--accent); }
  details.sec[open] > summary { color:var(--txt); }
  .sec .body { padding:2px 0 8px; }
  .trow { padding:3px 14px; cursor:pointer; font-size:12px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; }
  .trow:hover { background:var(--panel2); }
  .trow.sel { background:#2f3a48; color:#fff; }
  .trow .tag { color:var(--dim); font-size:10px; margin-left:6px; }
  .trow .wm { color:var(--accent2); font-size:10px; }
  #boneDetail, #slotDetail { padding:6px 14px; color:var(--dim); font-size:11px; border-top:1px dashed var(--line);
    white-space:pre-wrap; display:none; }
  .empty { padding:6px 14px; color:var(--dim); font-size:11px; font-style:italic; }
</style>
</head>
<body>
<header class="iw-toolbar">
  <a class="iw-brand" id="iw-home" href="/" title="Invisible Launcher">
    <svg width="22" height="18" viewBox="0 0 366 304" aria-hidden="true">
      <g fill="currentColor">
        <polygon points="20,50 40,73 336,9 336,5"/>
        <polygon points="13,55 28,80 21,278 17,278"/>
      </g>
    </svg>
    <span>INVISIBLE RIGGER</span>
  </a>
  <nav class="iw-switcher" id="iw-switcher" aria-label="Switch tool"></nav>
</header>
<script>
// Unified tool bar: render the role-gated switcher the launcher baked into the
// URL (`?home` = emblem target, `?tools` = [{id,name,url}]). Icon set mirrors
// roles.ts TOOL_ICONS by id. Keep in sync with $lib/ToolTopBar.svelte + spine view.html.
(function () {
  var qp = new URLSearchParams(location.search);
  var home = qp.get('home');
  var homeEl = document.getElementById('iw-home');
  if (home && homeEl) homeEl.href = home;
  var ICON = {
    editor: '<rect x="4" y="4" width="11" height="11" rx="1"/><rect x="9" y="9" width="11" height="11" rx="1"/>',
    sheetMaker: '<rect x="3" y="3" width="9" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="10" width="7" height="4" rx="1"/><rect x="3" y="14" width="13" height="7" rx="1"/>',
    atlasTool: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
    componentEditor: '<rect x="3" y="3" width="18" height="18" rx="2"/><rect x="7" y="7" width="6" height="6" rx="1"/><rect x="13" y="11" width="4" height="6" rx="1"/>',
    storybook: '<path d="M12 6c-1.5-1.6-3.8-2.5-6.5-2.5H4v14h1.5c2.7 0 5 .9 6.5 2.5 1.5-1.6 3.8-2.5 6.5-2.5H20v-14h-1.5c-2.7 0-5 .9-6.5 2.5z"/><line x1="12" y1="6" x2="12" y2="20"/>',
    spineViewer: '<circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="6" r="2.2"/><line x1="7.6" y1="16.4" x2="16.4" y2="7.6"/><circle cx="12" cy="12" r="1.3"/>',
    rigger: '<circle cx="5" cy="19" r="1.8"/><line x1="6.3" y1="17.7" x2="11.5" y2="12.5"/><circle cx="13" cy="11" r="1.8"/><line x1="14.3" y1="9.7" x2="17" y2="7"/><rect x="16" y="4" width="3.5" height="3.5" rx="0.6"/>',
    fontMaker: '<path d="M5 17 9.5 6h1L15 17"/><line x1="6.7" y1="13" x2="13.3" y2="13"/><line x1="4" y1="20" x2="20" y2="20"/>',
    localization: '<circle cx="12" cy="12" r="9"/><line x1="3" y1="12" x2="21" y2="12"/><path d="M12 3c2.6 2.6 2.6 15.4 0 18"/><path d="M12 3c-2.6 2.6-2.6 15.4 0 18"/>',
    symbols: '<rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/>',
    ftpBrowser: '<circle cx="5" cy="6" r="1"/><line x1="9" y1="6" x2="20" y2="6"/><circle cx="5" cy="12" r="1"/><line x1="9" y1="12" x2="20" y2="12"/><circle cx="5" cy="18" r="1"/><line x1="9" y1="18" x2="20" y2="18"/>'
  };
  function svg(id) {
    var b = ICON[id];
    if (!b) return '';
    return '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" ' +
      'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + b + '</svg>';
  }
  var tools = [];
  try { tools = JSON.parse(qp.get('tools') || '[]'); } catch (e) {}
  var nav = document.getElementById('iw-switcher');
  if (nav && Array.isArray(tools)) {
    tools.forEach(function (t) {
      if (!t || !t.url) return;
      var a = document.createElement('a');
      a.className = 'iw-tool';
      a.href = t.url;
      a.title = t.name || '';
      var ic = document.createElement('span');
      ic.className = 'ic';
      ic.innerHTML = svg(t.id);
      var lb = document.createElement('span');
      lb.className = 'label';
      lb.textContent = (t.name || '').replace(/^Invisible /, '');
      a.appendChild(ic);
      a.appendChild(lb);
      nav.appendChild(a);
    });
  }
})();
</script>
<div id="app">

    </div>
    <div class="row">

      <select id="project"></select>
      <div id="projNote" class="pill" style="margin-top:5px;"></div>
    </div>
    <div class="row">
      <label>Skeletons <span id="count" class="pill"></span>
        <button id="rescan" style="float:right;padding:1px 7px;font-size:11px;">rescan</button></label>
      <input type="text" id="filter" placeholder="filter…">

    <div class="row">

<script>
const $ = s => document.querySelector(s);
let SPINE = null, loadedLine = null;
let gl, renderer, assetMgr;
let skeleton, animState, skeletonData, lastFrame = 0;
let playing = true, looping = true, showBones = true, pma = true, preferPng = true;
let showMesh = false;
let selBone = null; // index into skeleton.bones / skeletonData.bones
let selSlot = null; // selected slot NAME (for draw-order + attachment placement)
let collapsedBones = new Set(); // bone names whose subtree is collapsed in the tree
let meshCtx = null; // { slotIndex, attName, attachment, weighted } when a mesh slot is selected (Phase 3)
let meshDragVert = null; // index of the mesh vertex being dragged
let selMeshVert = null; // selected mesh vertex (for UV editing, Phase 3.5)
// Phase 4.2 weight brush
let weightBrush = false, brushBone = null, brushRadiusPx = 50, brushStrength = 0.15;
let brushSubtract = false, brushPainting = false, lastDabWorld = null;
// Phase A-canvas: draw-a-mesh-from-scratch
let drawMeshMode = false, drawPoints = [];
let meshAddMode = false; // click-inside-mesh adds a vertex (Phase 3.2)
let meshRemoveMode = false; // click-an-interior-vertex removes it (Phase 3.3)
let editMode = false, rawDoc = null, rawDocOriginal = null, dirty = false;
let curEntry = null, dragging = false, boneDragging = false, lastXY = null;
let skeletons = [], selected = null, bgColor = {r:0.106,g:0.114,b:0.133,a:1};

// ---- runtime loading (one spine-webgl global at a time) -------------------
// Reuses the Spine Viewer's vendored runtimes + R2 endpoints (same project spines).
function loadRuntime(line){
  return new Promise((resolve, reject) => {
    if (loadedLine === line && window.spine){ SPINE = window.spine; return resolve(); }
    const s = document.createElement("script");
    s.src = "/spine/vendor/spine-webgl-" + line + ".js";
    s.onload = () => { SPINE = window.spine; loadedLine = line; resolve(); };
    s.onerror = () => reject(new Error("Failed to load runtime " + line));
    document.head.appendChild(s);
  });
}

function showErr(msg){ const e = $("#err"); e.textContent = msg; e.style.display = "block"; }
function clearErr(){ $("#err").style.display = "none"; }

function initGL(){
  const cv = $("#cv");
  gl = cv.getContext("webgl", {alpha:true, premultipliedAlpha:false})
    || cv.getContext("experimental-webgl");
  renderer = new SPINE.SceneRenderer(cv, gl);
  assetMgr = new SPINE.AssetManager(gl);
}

function resizeCanvas(){
  const cv = $("#cv"), dpr = window.devicePixelRatio || 1;
  const w = Math.floor(cv.clientWidth * dpr), h = Math.floor(cv.clientHeight * dpr);
  if (cv.width !== w || cv.height !== h){ cv.width = w; cv.height = h; }
}

function updateWorld(){
  if (SPINE.Physics && SPINE.Physics.update !== undefined)
    skeleton.updateWorldTransform(SPINE.Physics.update);
  else
    skeleton.updateWorldTransform();
}

// ---- load a skeleton ------------------------------------------------------
async function selectSkeleton(entry){
  selected = entry;
  renderList();
  clearErr();
  $("#rt").textContent = "runtime " + entry.runtime + (entry.version ? " · spine " + entry.version : "");

  if (loadedLine && loadedLine !== entry.runtime){
    location.hash = "id=" + entry.id + "&rt=" + entry.runtime;
    location.reload();
    return;
  }
  try { await loadRuntime(entry.runtime); }
  catch(e){ showErr(String(e.message || e)); return; }

  if (!gl) initGL();

  const base = "/spine/file?dir=" + encodeURIComponent(entry.dir_b64) + (preferPng ? "&pp=1" : "")
    + "&v=" + Date.now() + "&name=";
  assetMgr = new SPINE.AssetManager(gl, base);
  assetMgr.loadTextureAtlas(entry.atlas_file);
  if (entry.format === "skel") assetMgr.loadBinary(entry.skeleton_file);
  else assetMgr.loadJson(entry.skeleton_file);

  await waitAssets();
  try { buildSkeleton(entry); }
  catch(e){ showErr("Build failed: " + (e.message || e)); }
}

function waitAssets(){
  return new Promise((resolve, reject) => {
    const tick = () => {
      if (assetMgr.isLoadingComplete()){
        const errs = assetMgr.getErrors && assetMgr.getErrors();
        if (errs && Object.keys(errs).length)
          reject(new Error("Asset load error:\n" + JSON.stringify(errs, null, 2)));
        else resolve();
      } else requestAnimationFrame(tick);
    };
    tick();
  });
}

// Premultiply straight-alpha pages on upload (mirrors the Spine Viewer; fixes
// white halos on additive attachments). See spine/view.html for the full why.
function premultiplyAtlas(atlas){
  if (!gl || !atlas || !atlas.pages) return;
  atlas.pages.forEach(p => {
    const tex = p.texture;
    if (!tex || !tex._image || !tex.texture) return;
    gl.bindTexture(gl.TEXTURE_2D, tex.texture);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, tex._image);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  });
}

function buildSkeleton(entry){
  const atlas = assetMgr.require(entry.atlas_file);
  if (pma) premultiplyAtlas(atlas);
  const loader = new SPINE.AtlasAttachmentLoader(atlas);
  if (entry.format === "skel"){
    const bin = new SPINE.SkeletonBinary(loader);
    skeletonData = bin.readSkeletonData(new Uint8Array(assetMgr.require(entry.skeleton_file)));
  } else {
    const sj = new SPINE.SkeletonJson(loader);
    skeletonData = sj.readSkeletonData(assetMgr.require(entry.skeleton_file));
  }
  skeleton = new SPINE.Skeleton(skeletonData);
  animState = new SPINE.AnimationState(new SPINE.AnimationStateData(skeletonData));

  const aSel = $("#anim"); aSel.innerHTML = "";
  skeletonData.animations.forEach(a => {
    const o = document.createElement("option");
    o.value = a.name; o.textContent = a.name + "  (" + a.duration.toFixed(2) + "s)";
    aSel.appendChild(o);
  });
  const sSel = $("#skin"); sSel.innerHTML = "";
  skeletonData.skins.forEach(sk => {
    const o = document.createElement("option"); o.value = sk.name; o.textContent = sk.name;
    sSel.appendChild(o);
  });
  if (skeletonData.skins.length){
    const def = skeletonData.skins.find(s => s.name === "default") || skeletonData.skins[0];
    skeleton.setSkinByName(def.name); sSel.value = def.name;
  }
  skeleton.setToSetupPose();
  updateWorld();

  // Editable source of truth: the parsed skeleton JSON. We mutate this in place per
  // edit and export it verbatim (preserves animations + every field exactly). Only
  // JSON skeletons are editable; binary `.skel` is view-only in Phase 2.
  let parsed = entry.format === "json" ? assetMgr.require(entry.skeleton_file) : null;
  if (typeof parsed === "string") { try { parsed = JSON.parse(parsed); } catch { parsed = null; } }
  rawDoc = parsed && Array.isArray(parsed.bones) ? parsed : null;
  rawDocOriginal = rawDoc ? JSON.parse(JSON.stringify(rawDoc)) : null;
  dirty = false;
  $("#editBtn").disabled = !rawDoc;
  setEditMode(false);

  selBone = null;
  selSlot = null;
  collapsedBones.clear();
  buildInspector(entry);

  if (skeletonData.animations.length){
    aSel.value = skeletonData.animations[0].name;
    setAnim(aSel.value);
  } else { curEntry = null; }

  fitView();
}

function setAnim(name){
  curEntry = animState.setAnimation(0, name, looping);
  playing = true; $("#play").textContent = "❚❚ Pause";
  $("#anim").value = name;
}

// ---- inspector (the Rigger's read-model panel) ----------------------------
function clearChildren(el){ while (el.firstChild) el.removeChild(el.firstChild); }

function buildInspector(entry){
  $("#insName").textContent = entry.name.replace(/^\//, "") || entry.skeleton_file;
  $("#insSub").textContent = "spine " + (entry.version || entry.runtime) + " · "
    + skeletonData.bones.length + " bones";

  // ---- bone hierarchy tree ----
  const tree = $("#boneTree"); clearChildren(tree);
  if (editMode){
    const ab = document.createElement("button");
    ab.textContent = "＋ Add bone";
    ab.title = "Add a bone as a child of the selected bone (or root)";
    ab.style.cssText = "margin:6px 14px 2px;";
    ab.onclick = () => addBone(selBone != null ? skeletonData.bones[selBone].name : null);
    tree.appendChild(ab);
  }
  const bones = skeletonData.bones;
  const childrenOf = new Map();
  bones.forEach((b, i) => {
    const pi = b.parent ? bones.indexOf(b.parent) : -1;
    if (!childrenOf.has(pi)) childrenOf.set(pi, []);
    childrenOf.get(pi).push(i);
  });
  const renderBoneRows = (parentIdx, depth) => {
    for (const i of (childrenOf.get(parentIdx) || [])){
      const b = bones[i];
      const kids = childrenOf.get(i) || [];
      const collapsed = collapsedBones.has(b.name);
      const row = document.createElement("div");
      row.className = "trow" + (selBone === i ? " sel" : "");
      row.dataset.bone = i;
      row.style.paddingLeft = (14 + depth * 13) + "px";
      const tog = document.createElement("span");
      tog.textContent = kids.length ? (collapsed ? "▸ " : "▾ ") : "   ";
      tog.style.cssText = "cursor:" + (kids.length ? "pointer" : "default") + ";color:var(--accent);";
      if (kids.length) tog.onclick = (e) => {
        e.stopPropagation();
        if (collapsed) collapsedBones.delete(b.name); else collapsedBones.add(b.name);
        buildInspector(selected);
        if (selBone != null) selectBone(selBone);
        if (selSlot) selectSlot(selSlot);
      };
      row.appendChild(tog);
      const nm = document.createElement("span"); nm.textContent = b.name;
      row.appendChild(nm);
      if (b.length) { const t = document.createElement("span"); t.className = "tag"; t.textContent = "len " + Math.round(b.length); row.appendChild(t); }
      row.onclick = () => selectBone(i); // whole row, not just the name
      tree.appendChild(row);
      if (!collapsed) renderBoneRows(i, depth + 1);
    }
  };
  renderBoneRows(-1, 0);
  $("#cBones").textContent = "(" + bones.length + ")";
  $("#boneDetail").style.display = "none";

  // ---- slots in draw order (setup order = skeletonData.slots = rawDoc.slots) ----
  const slotList = $("#slotList"); clearChildren(slotList);
  if (editMode){
    const as = document.createElement("button");
    as.textContent = "＋ Add slot";
    as.title = "Add a slot on the selected bone (or root)";
    as.style.cssText = "margin:6px 14px 2px;";
    as.onclick = () => addSlot(selBone != null ? skeletonData.bones[selBone].name : null);
    slotList.appendChild(as);
  }
  const slots = skeletonData.slots;
  slots.forEach((sd, z) => {
    const row = document.createElement("div");
    row.className = "trow" + (selSlot === sd.name ? " sel" : "");
    row.dataset.slot = sd.name;
    const nm = document.createElement("span");
    nm.textContent = sd.name;
    row.appendChild(nm);
    row.onclick = () => selectSlot(sd.name); // whole row, not just the name
    const t = document.createElement("span"); t.className = "tag";
    t.textContent = "→ " + (sd.boneData ? sd.boneData.name : "") + (sd.attachmentName ? " · " + sd.attachmentName : "");
    row.appendChild(t);
    if (editMode){
      const ctl = document.createElement("span");
      ctl.style.cssText = "float:right;display:inline-flex;gap:2px;";
      const mk = (txt, d, dis, title) => {
        const b = document.createElement("button");
        b.textContent = txt; b.title = title; b.disabled = dis;
        b.style.cssText = "padding:0 5px;font-size:11px;line-height:16px;";
        b.onclick = (e) => { e.stopPropagation(); moveSlot(z, d); };
        return b;
      };
      ctl.appendChild(mk("↑", -1, z === 0, "move back (earlier in draw order)"));
      ctl.appendChild(mk("↓", 1, z === slots.length - 1, "move forward (later in draw order)"));
      row.appendChild(ctl);
    }
    slotList.appendChild(row);
  });
  $("#cSlots").textContent = "(" + slots.length + ")";
  renderSlotDetail();

  // ---- skins + attachment counts (flag weighted meshes) ----
  const skinList = $("#skinList"); clearChildren(skinList);
  const activeSkinName = (skeleton && skeleton.skin && skeleton.skin.name) || "default";
  {
    const hint = document.createElement("div");
    hint.textContent = "click a skin to view its images / meshes / weights";
    hint.style.cssText = "margin:4px 14px;color:var(--dim);font-size:11px;";
    skinList.appendChild(hint);
  }
  if (editMode){
    const ak = document.createElement("button");
    ak.textContent = "＋ Add skin";
    ak.style.cssText = "margin:2px 14px 2px;";
    ak.onclick = addSkin;
    skinList.appendChild(ak);
  }
  skeletonData.skins.forEach(sk => {
    const atts = sk.getAttachments ? sk.getAttachments() : [];
    let weighted = 0, meshes = 0;
    for (const e of atts){
      const a = e.attachment;
      if (a && a.constructor && a.constructor.name === "MeshAttachment"){
        meshes++; if (a.bones && a.bones.length) weighted++;
      }
    }
    const row = document.createElement("div");
    row.className = "trow" + (sk.name === activeSkinName ? " sel" : "");
    row.dataset.skin = sk.name;
    row.onclick = () => setActiveSkin(sk.name);
    const nm = document.createElement("span"); nm.textContent = sk.name; row.appendChild(nm);
    if (sk.name === activeSkinName){ const a = document.createElement("span"); a.className = "tag"; a.textContent = "active"; a.style.color = "var(--accent)"; row.appendChild(a); }
    const t = document.createElement("span"); t.className = "tag";
    t.textContent = atts.length + " attachments";
    row.appendChild(t);
    if (meshes){
      const w = document.createElement("span"); w.className = "wm";
      w.textContent = "  " + meshes + " mesh" + (weighted ? " · " + weighted + " weighted" : "");
      row.appendChild(w);

    if (editMode){
      const ctl = document.createElement("span");
      ctl.style.cssText = "float:right;display:inline-flex;gap:2px;";

      ctl.appendChild(rn);
      if (skeletonData.skins.length > 1){
        const del = document.createElement("button");
        del.textContent = "🗑"; del.title = "delete skin"; del.style.cssText = "padding:0 6px;";
        del.onclick = (e) => { e.stopPropagation(); if (confirm('Delete skin "' + sk.name + '" and all its attachments?')) deleteSkin(sk.name); };
        ctl.appendChild(del);
      }
      row.appendChild(ctl);

  });
  $("#cSkins").textContent = "(" + skeletonData.skins.length + ")";

  // ---- animations (click to play) ----
  const animList = $("#animList"); clearChildren(animList);
  skeletonData.animations.forEach(a => {
    const row = document.createElement("div");
    row.className = "trow";
    row.textContent = a.name;
    const t = document.createElement("span"); t.className = "tag";
    t.textContent = a.duration.toFixed(2) + "s";
    row.appendChild(t);
    row.onclick = () => setAnim(a.name);
    animList.appendChild(row);
  });
  $("#cAnims").textContent = "(" + skeletonData.animations.length + ")";

  // ---- constraints ----
  const consList = $("#consList"); clearChildren(consList);
  const addCons = (arr, kind) => arr.forEach(c => {
    const row = document.createElement("div");
    row.className = "trow";
    row.textContent = c.name;
    const t = document.createElement("span"); t.className = "tag"; t.textContent = kind;
    row.appendChild(t);
    consList.appendChild(row);
  });
  addCons(skeletonData.ikConstraints || [], "IK");
  addCons(skeletonData.transformConstraints || [], "transform");
  addCons(skeletonData.pathConstraints || [], "path");
  const cCount = (skeletonData.ikConstraints||[]).length + (skeletonData.transformConstraints||[]).length
    + (skeletonData.pathConstraints||[]).length;
  $("#cCons").textContent = "(" + cCount + ")";
  if (!cCount){ const e = document.createElement("div"); e.className = "empty"; e.textContent = "none"; consList.appendChild(e); }
}

function selectBone(i){
  selBone = i;
  document.querySelectorAll('#boneTree .trow').forEach(r => {
    r.classList.toggle("sel", parseInt(r.dataset.bone, 10) === i);
  });
  renderBoneDetail();
}

function renderBoneDetail(){
  const det = $("#boneDetail");
  if (selBone == null){ det.style.display = "none"; return; }
  const bd = skeletonData.bones[selBone], bw = skeleton.bones[selBone];
  det.style.display = "block";

      bd.name + "\n" +

      "scale:  " + bd.scaleX.toFixed(2) + " × " + bd.scaleY.toFixed(2) +
      "   world: " + Math.round(bw.worldX) + ", " + Math.round(bw.worldY);

  // edit mode: numeric transform editors for the selected bone's setup pose

  det.appendChild(title);

  {
    const row = document.createElement("label");
    row.style.cssText = "display:flex;gap:6px;align-items:center;margin:3px 0;color:var(--dim);";
    const lb = document.createElement("span"); lb.textContent = "name"; lb.style.cssText = "width:54px;font-size:11px;";
    const inp = document.createElement("input"); inp.type = "text"; inp.value = bd.name;
    inp.style.cssText = "flex:1;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:5px;padding:3px 6px;font-size:12px;";
    inp.onchange = () => renameBone(bd.name, inp.value);
    row.appendChild(lb); row.appendChild(inp); det.appendChild(row);
  }

  // reparent control — excludes self + descendants (no cycles); "(root)" = no parent
  const desc = descendantNames(bd.name);

  prow.style.cssText = "display:flex;align-items:center;gap:6px;margin:3px 0 7px;color:var(--dim);";
  const plb = document.createElement("span"); plb.textContent = "parent"; plb.style.cssText = "width:54px;font-size:11px;";
  const psel = document.createElement("select");
  psel.style.cssText = "flex:1;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:5px;padding:3px 6px;font-size:12px;";

  skeletonData.bones.forEach((b) => {

  psel.onchange = () => reparentBone(selBone, psel.value);

  const del = document.createElement("button");

  del.style.cssText = "margin-top:8px;width:100%;color:var(--bad,#e66);border-color:var(--bad,#e66);";

  del.title = del.disabled ? "the root bone can't be deleted" : "children + slots reparent to " + (bd.parent ? bd.parent.name : "—");
  del.onclick = () => { if (confirm('Delete bone "' + bd.name + '"? Its children and slots move to ' + (bd.parent ? bd.parent.name : "root") + ".")) deleteBone(bd.name); };
  det.appendChild(del);
}

// Apply a setup-pose transform edit: mutate the live BoneData (instant render) AND
// the export source (rawDoc, matched by bone NAME so index drift can't corrupt it).
function applyBoneEdit(key, value){
  if (selBone == null || !rawDoc) return;
  const v = parseFloat(value);
  if (Number.isNaN(v)) return;
  const bd = skeletonData.bones[selBone];
  bd[key] = v;
  const rb = rawDoc.bones.find((b) => b.name === bd.name);
  if (rb) rb[key] = v;
  skeleton.setToSetupPose();
  updateWorld();
  markDirty();
}

function markDirty(){
  dirty = true;
  $("#resetBtn").disabled = false;
}

// ---- authoring primitives (Phase 5.1) -------------------------------------
function uniqueName(base, existing){ let n = 1; while (existing.has(base + n)) n++; return base + n; }

// Add a new bone as a child of `parentName` (or root). Positioned at the parent
// origin (drag/numeric-edit to place). Selects the new bone.
function addBone(parentName){
  if (!rawDoc || !Array.isArray(rawDoc.bones) || !rawDoc.bones.length) return;
  const name = uniqueName("bone", new Set(rawDoc.bones.map((b) => b.name)));
  rawDoc.bones.push({ name, parent: parentName || rawDoc.bones[0].name, x: 0, y: 0 });
  rebuildFromRawDoc(name); // reselects by name
  markDirty();
}

// Add a new slot on `boneName` (or root). Selects it.
function addSlot(boneName){
  if (!rawDoc || !Array.isArray(rawDoc.bones) || !rawDoc.bones.length) return;
  rawDoc.slots = rawDoc.slots || [];
  const name = uniqueName("slot", new Set(rawDoc.slots.map((s) => s.name)));
  rawDoc.slots.push({ name, bone: boneName || rawDoc.bones[0].name });
  selSlot = name;
  rebuildFromRawDoc(selBone != null ? skeletonData.bones[selBone].name : null);
  markDirty();
}

// Add a new (empty) skin.
function addSkin(){
  if (!rawDoc) return;
  rawDoc.skins = rawDoc.skins || [];
  const name = uniqueName("skin", new Set(rawDoc.skins.map((s) => s.name)));
  rawDoc.skins.push({ name, attachments: {} });
  rebuildFromRawDoc(selBone != null ? skeletonData.bones[selBone].name : null);
  markDirty();
}

const cleanName = (n) => (n || "").trim().replace(/[^\w\-. ]/g, "_");

// Rename a bone, rewriting every reference: child parents, slot bones, IK/transform/
// path constraint bones+targets, and animation `bones` timeline keys.
function renameBone(oldName, newName){
  if (!rawDoc) return;
  newName = cleanName(newName);
  if (!newName || newName === oldName || rawDoc.bones.some((b) => b.name === newName)) return;
  for (const b of rawDoc.bones){ if (b.name === oldName) b.name = newName; if (b.parent === oldName) b.parent = newName; }
  for (const s of rawDoc.slots || []) if (s.bone === oldName) s.bone = newName;
  for (const grp of ["ik", "transform", "path"]) for (const c of rawDoc[grp] || []){
    if (Array.isArray(c.bones)) c.bones = c.bones.map((n) => (n === oldName ? newName : n));
    if (c.target === oldName) c.target = newName;
    if (c.bone === oldName) c.bone = newName;
  }
  for (const an of Object.values(rawDoc.animations || {}))
    if (an.bones && an.bones[oldName]){ an.bones[newName] = an.bones[oldName]; delete an.bones[oldName]; }
  if (collapsedBones.has(oldName)){ collapsedBones.delete(oldName); collapsedBones.add(newName); }
  rebuildFromRawDoc(newName);
  markDirty();
}

// Rename a slot, rewriting skin attachment keys + animation slot/deform/drawOrder refs.
function renameSlot(oldName, newName){
  if (!rawDoc) return;
  newName = cleanName(newName);
  if (!newName || newName === oldName || (rawDoc.slots || []).some((s) => s.name === newName)) return;
  for (const s of rawDoc.slots || []) if (s.name === oldName) s.name = newName;
  for (const sk of rawDoc.skins || [])
    if (sk.attachments && sk.attachments[oldName]){ sk.attachments[newName] = sk.attachments[oldName]; delete sk.attachments[oldName]; }
  for (const an of Object.values(rawDoc.animations || {})){
    if (an.slots && an.slots[oldName]){ an.slots[newName] = an.slots[oldName]; delete an.slots[oldName]; }
    if (an.deform) for (const sm of Object.values(an.deform)) if (sm && sm[oldName]){ sm[newName] = sm[oldName]; delete sm[oldName]; }
    if (Array.isArray(an.drawOrder)) for (const fr of an.drawOrder) if (Array.isArray(fr.offsets)) for (const o of fr.offsets) if (o.slot === oldName) o.slot = newName;
  }
  if (selSlot === oldName) selSlot = newName;
  rebuildFromRawDoc(selBone != null ? skeletonData.bones[selBone].name : null);
  markDirty();
}

// Rename a skin (+ any linkedmesh `skin` refs pointing at it).
function renameSkin(oldName, newName){
  if (!rawDoc) return;
  newName = cleanName(newName);
  if (!newName || newName === oldName || (rawDoc.skins || []).some((s) => s.name === newName)) return;
  for (const sk of rawDoc.skins || []){
    if (sk.name === oldName) sk.name = newName;
    for (const slot of Object.values(sk.attachments || {}))
      for (const att of Object.values(slot)) if (att && att.type === "linkedmesh" && att.skin === oldName) att.skin = newName;
  }
  rebuildFromRawDoc(selBone != null ? skeletonData.bones[selBone].name : null);
  markDirty();
}

// ---- delete (Phase A-delete) ----------------------------------------------
// Delete a bone (not root). Children + slots reparent to its parent; constraints
// that reference it are cleaned/dropped; animation track removed; and CRITICALLY
// every weighted mesh's bone INDICES are remapped by name (the deleted bone's
// influences dropped + weights renormalised — bone indices are positional).
function deleteBone(name){
  if (!rawDoc) return;
  const idx = rawDoc.bones.findIndex((b) => b.name === name);
  if (idx <= 0) return; // root (index 0) or not found
  const parentName = rawDoc.bones[idx].parent;
  const oldNames = rawDoc.bones.map((b) => b.name); // index→name BEFORE removal
  for (const b of rawDoc.bones) if (b.parent === name) b.parent = parentName;
  for (const s of rawDoc.slots || []) if (s.bone === name) s.bone = parentName;
  for (const grp of ["ik", "transform", "path"]){
    if (!Array.isArray(rawDoc[grp])) continue;
    rawDoc[grp] = rawDoc[grp].filter((c) => {
      if (Array.isArray(c.bones)) c.bones = c.bones.filter((n) => n !== name);
      const broken = c.target === name || c.bone === name || (Array.isArray(c.bones) && c.bones.length === 0);
      return !broken;
    });
    if (!rawDoc[grp].length) delete rawDoc[grp];
  }
  rawDoc.bones.splice(idx, 1);
  for (const an of Object.values(rawDoc.animations || {})) if (an.bones) delete an.bones[name];

  // remap weighted-mesh bone indices by name
  const newIndexByName = new Map(rawDoc.bones.map((b, i) => [b.name, i]));
  const parentIdx = newIndexByName.get(parentName);
  for (const sk of rawDoc.skins || []) for (const slot of Object.values(sk.attachments || {})) for (const att of Object.values(slot)){
    if (!att || att.type !== "mesh" || !Array.isArray(att.vertices) || !Array.isArray(att.uvs)) continue;
    if (att.vertices.length === att.uvs.length) continue; // unweighted — no bone indices
    const vc = att.uvs.length / 2, out = [];
    let ri = 0;
    for (let v = 0; v < vc; v++){
      const n = att.vertices[ri++], infl = [];
      for (let j = 0; j < n; j++){ const bi = att.vertices[ri++], x = att.vertices[ri++], y = att.vertices[ri++], w = att.vertices[ri++]; infl.push({ bi, x, y, w }); }
      let dropped = false;
      let kept = infl
        .filter((f) => { const keep = oldNames[f.bi] !== name; if (!keep) dropped = true; return keep; })
        .map((f) => ({ bone: newIndexByName.get(oldNames[f.bi]), x: f.x, y: f.y, w: f.w }))
        .filter((f) => { if (f.bone === undefined){ dropped = true; return false; } return true; });
      if (!kept.length && parentIdx !== undefined){ const r = infl[0] || { x: 0, y: 0 }; kept = [{ bone: parentIdx, x: r.x, y: r.y, w: 1 }]; dropped = true; }
      // only renormalise vertices that actually lost an influence — leave the rest
      // bit-identical (the source weights may not sum to exactly 1; don't disturb them)
      if (dropped){
        let sum = 0; for (const k of kept) sum += k.w;
        if (sum > 1e-9) for (const k of kept) k.w /= sum; else { const eq = kept.length ? 1 / kept.length : 1; for (const k of kept) k.w = eq; }
      }
      out.push(kept.length); for (const k of kept) out.push(k.bone, k.x, k.y, k.w);
    }
    att.vertices = out;
  }
  if (collapsedBones.has(name)) collapsedBones.delete(name);
  selBone = null;
  rebuildFromRawDoc(parentName);
  markDirty();
}

// Delete a slot + its attachments (all skins) + animation slot/deform/drawOrder refs.
function deleteSlot(name){
  if (!rawDoc) return;
  rawDoc.slots = (rawDoc.slots || []).filter((s) => s.name !== name);
  for (const sk of rawDoc.skins || []) if (sk.attachments) delete sk.attachments[name];
  for (const an of Object.values(rawDoc.animations || {})){
    if (an.slots) delete an.slots[name];
    if (an.deform) for (const sm of Object.values(an.deform)) if (sm) delete sm[name];
    if (Array.isArray(an.drawOrder)) for (const fr of an.drawOrder) if (Array.isArray(fr.offsets)) fr.offsets = fr.offsets.filter((o) => o.slot !== name);
  }
  if (selSlot === name) selSlot = null;
  rebuildFromRawDoc(selBone != null ? skeletonData.bones[selBone].name : null);
  markDirty();
}

// Delete an attachment (image) from a slot in every skin; clear the slot's setup
// attachment if it pointed there.
function deleteAttachment(slotName, attName){
  if (!rawDoc) return;
  for (const sk of rawDoc.skins || []) if (sk.attachments && sk.attachments[slotName]) delete sk.attachments[slotName][attName];
  const slot = (rawDoc.slots || []).find((s) => s.name === slotName);
  if (slot && slot.attachment === attName) delete slot.attachment;
  for (const an of Object.values(rawDoc.animations || {})) if (an.deform) for (const sm of Object.values(an.deform)) if (sm && sm[slotName]) delete sm[slotName][attName];
  rebuildFromRawDoc(selBone != null ? skeletonData.bones[selBone].name : null);
  markDirty();
}

// Delete a skin (keep at least one).
function deleteSkin(name){
  if (!rawDoc || (rawDoc.skins || []).length <= 1) return;
  rawDoc.skins = rawDoc.skins.filter((s) => s.name !== name);
  rebuildFromRawDoc(selBone != null ? skeletonData.bones[selBone].name : null);
  markDirty();
}

// Set the on-stage skin — this is how you VIEW a skin's images/meshes/weights. Syncs
// the top-bar selector + the SKINS-list highlight, and refreshes the open slot detail
// so its mesh/weight tools track the newly-active skin's attachment.
function setActiveSkin(name){
  if (!skeleton) return;
  skeleton.setSkinByName(name);
  skeleton.setSlotsToSetupPose();
  updateWorld();
  const top = $("#skin"); if (top) top.value = name;
  buildInspector(selected); // re-render skin rows (active badge/highlight) under this skin
  if (selBone != null) selectBone(selBone);
  if (selSlot) selectSlot(selSlot); // refresh the slot's mesh/weight UI for this skin
}

// Attach a packed image (atlas region) to the selected slot in the active skin —
// the "import image" action. Creates a region attachment (size from the atlas;
// position defaults to the bone origin, then editable / convertible to a mesh).
function attachRegion(regionName){
  if (!rawDoc || selSlot == null || !regionName) return;
  const atlas = selected ? assetMgr.require(selected.atlas_file) : null;
  const region = atlas && atlas.findRegion ? atlas.findRegion(regionName) : null;
  const w = region ? region.originalWidth || region.width || 0 : 0;
  const h = region ? region.originalHeight || region.height || 0 : 0;
  const skinName = $("#skin").value || (skeletonData.skins[0] && skeletonData.skins[0].name) || "default";
  rawDoc.skins = rawDoc.skins || [];
  let sk = rawDoc.skins.find((s) => s.name === skinName);
  if (!sk){ sk = { name: skinName, attachments: {} }; rawDoc.skins.push(sk); }
  sk.attachments = sk.attachments || {};
  sk.attachments[selSlot] = sk.attachments[selSlot] || {};
  sk.attachments[selSlot][regionName] = { width: w, height: h }; // type defaults to region; path defaults to name
  const slot = rawDoc.slots.find((s) => s.name === selSlot);
  if (slot) slot.attachment = regionName;
  rebuildFromRawDoc(selBone != null ? skeletonData.bones[selBone].name : null);
  markDirty();
}

// Create a NEW rig: a blank skeleton (root + default skin) saved INTO an existing
// atlas folder (so it's indexed + loaded and that atlas's images are attachable),
// then opened. dir = the chosen atlas folder's base64url token.
async function createNewRig(){
  const name = ($("#newRigName").value || "").trim().replace(/[^A-Za-z0-9_-]/g, "_");
  const manifestKey = $("#newRigAtlas").value;
  const note = $("#newRigNote");
  if (!name){ note.textContent = "enter a name"; return; }
  if (!manifestKey){ note.textContent = "pick an atlas"; return; }
  note.textContent = "creating…";
  try {
    // Server assembles a spine bundle (synth .atlas + page copy + blank .irig) from the atlas.
    const r = await fetch("/api/rigger/new", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ manifestKey, name }) });
    if (!r.ok) throw new Error((await r.text()) || ("HTTP " + r.status));
    const j = await r.json();
    $("#newRig").style.display = "none"; $("#newRigName").value = "";
    await loadSkeletons(true);
    const target = skeletons.find((s) => s.dir_b64 === j.dir && s.skeleton_file === j.stem + ".irig");
    if (target){ await selectSkeleton(target); setEditMode(true); }
  } catch (e){ note.textContent = "failed: " + (e.message || e); }
}

function loadImageFile(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image " + file.name)); };
    img.src = url;
  });
}

// Create a NEW rig from RAW uploaded images: pack them onto one page (shelf pack,
// browser Canvas), then POST the page PNG + region rects to /api/rigger/upload,
// which synthesises the .atlas + writes the bundle. No Atlas Maker step needed.
async function createRigFromImages(files){
  const note = $("#newRigNote");
  const name = ($("#newRigName").value || "").trim().replace(/[^A-Za-z0-9_-]/g, "_");
  if (!name){ note.textContent = "enter a rig name first"; return; }
  if (!files || !files.length) return;
  note.textContent = "packing " + files.length + " image(s)…";
  try {
    const loaded = [], seen = new Set();
    for (const f of files){
      const img = await loadImageFile(f);
      let base = f.name.replace(/\.[^.]+$/, "").replace(/[^\w\-]/g, "_") || "img";
      let nm = base, k = 1; while (seen.has(nm)) nm = base + "_" + k++;
      seen.add(nm); loaded.push({ name: nm, img });
    }
    // shelf pack (tallest first, wrap at MAX_W)
    const MAX_W = 2048, pad = 2;
    loaded.sort((a, b) => b.img.height - a.img.height);
    let x = pad, y = pad, rowH = 0, pageW = 0;
    const regions = [];
    for (const it of loaded){
      const w = it.img.width, h = it.img.height;
      if (x + w + pad > MAX_W && x > pad){ y += rowH + pad; x = pad; rowH = 0; }
      regions.push({ name: it.name, x, y, w, h, img: it.img });
      x += w + pad; rowH = Math.max(rowH, h); pageW = Math.max(pageW, x + pad);
    }
    const pageH = y + rowH + pad;
    const cv = document.createElement("canvas"); cv.width = pageW; cv.height = pageH;
    const ctx = cv.getContext("2d");
    for (const r of regions) ctx.drawImage(r.img, r.x, r.y);
    const page = cv.toDataURL("image/png");
    note.textContent = "uploading…";
    const resp = await fetch("/api/rigger/upload", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ name, page, pageWidth: pageW, pageHeight: pageH, regions: regions.map((r) => ({ name: r.name, x: r.x, y: r.y, w: r.w, h: r.h })) }),
    });
    if (!resp.ok) throw new Error((await resp.text()) || ("HTTP " + resp.status));
    const j = await resp.json();
    $("#newRig").style.display = "none"; $("#newRigName").value = ""; $("#newRigFiles").value = "";
    await loadSkeletons(true);
    const target = skeletons.find((s) => s.dir_b64 === j.dir && s.skeleton_file === j.stem + ".irig");
    if (target){ await selectSkeleton(target); setEditMode(true); }
  } catch (e){ note.textContent = "failed: " + (e.message || e); }
}

// Edit a region attachment's placement: mutate the live RegionAttachment (+
// updateRegion to recompute its geometry) and the export source (rawDoc skin entry).
function applyAttachmentEdit(key, value){
  if (selSlot == null || !rawDoc) return;
  const v = parseFloat(value);
  if (Number.isNaN(v)) return;
  const slotIndex = skeletonData.slots.findIndex((s) => s.name === selSlot);
  const sd = skeletonData.slots[slotIndex];
  const attName = sd && sd.attachmentName;
  if (!attName) return;
  const att = skeleton.getAttachment(slotIndex, attName);
  if (!att || att.constructor.name !== "RegionAttachment") return;
  att[key] = v;
  if (att.updateRegion) att.updateRegion();
  // mirror into the skin entry that actually defines this slot/attachment
  for (const sk of rawDoc.skins){
    const a = sk.attachments && sk.attachments[selSlot] && sk.attachments[selSlot][attName];
    if (a){ a[key] = v; break; }
  }
  markDirty();
}

// Reorder a slot in the draw order (structural — slots[] order IS draw order).
function moveSlot(z, dir){
  if (!rawDoc) return;
  const j = z + dir;
  if (j < 0 || j >= rawDoc.slots.length) return;
  const movedName = rawDoc.slots[z].name;
  const tmp = rawDoc.slots[z]; rawDoc.slots[z] = rawDoc.slots[j]; rawDoc.slots[j] = tmp;
  selSlot = movedName;
  rebuildFromRawDoc(selBone != null ? skeletonData.bones[selBone].name : null);
  markDirty();
}

// ---- mesh vertex editing (Phase 3.1) --------------------------------------
// Transform a WORLD vector delta into a bone's local space (inverse of the bone's
// world linear matrix [a b; c d]) — used to update bone-local vertex coords.
function invWorldVec(bone, wx, wy){
  const det = bone.a * bone.d - bone.b * bone.c;
  if (Math.abs(det) < 1e-8) return { x: wx, y: wy };
  return { x: (bone.d * wx - bone.b * wy) / det, y: (bone.a * wy - bone.c * wx) / det };
}

// squared distance from (px,py) to segment a→b
function segDist2(px, py, ax, ay, bx, by){
  const dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy;
  let t = len2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / len2 : 0;
  t = Math.max(0, Math.min(1, t));
  const cx = ax + t * dx, cy = ay + t * dy;
  return (px - cx) * (px - cx) + (py - cy) * (py - cy);
}

// Bone nearest the cursor (by its setup-pose segment / origin), within a
// screen-scaled threshold; -1 if none. Lets you click a bone on the canvas.
function nearestBone(e){
  if (!skeleton) return -1;
  const cw = cursorWorld(e);
  if (!cw) return -1;
  const thr = renderer.camera.zoom * 12;
  let best = -1, bestD = Infinity;
  for (let i = 0; i < skeleton.bones.length; i++){
    const b = skeleton.bones[i];
    const tipX = b.worldX + b.data.length * b.a, tipY = b.worldY + b.data.length * b.c;
    const d = b.data.length > 0
      ? Math.sqrt(segDist2(cw.x, cw.y, b.worldX, b.worldY, tipX, tipY))
      : Math.hypot(cw.x - b.worldX, cw.y - b.worldY);
    if (d < bestD){ bestD = d; best = i; }
  }
  return bestD < thr ? best : -1;
}

// UV of world point P within the region quad (corners flat BL,UL,UR,BR — 8 floats),
// via the affine inverse (region placement is affine: rotate/scale/shear). UL→(0,0),
// UR→(1,0), BL→(0,1), so uv = (s,t) in that basis.
function affineUV(c, Px, Py){
  const ulx = c[2], uly = c[3], urx = c[4], ury = c[5], blx = c[0], bly = c[1];
  const eux = urx - ulx, euy = ury - uly, evx = blx - ulx, evy = bly - uly;
  const det = eux * evy - evx * euy;
  if (Math.abs(det) < 1e-8) return { u: 0.5, v: 0.5 };
  const rx = Px - ulx, ry = Py - uly;
  return { u: (rx * evy - evx * ry) / det, v: (eux * ry - rx * euy) / det };
}

// Finish "draw mesh from scratch": turn the clicked boundary points into a MESH on
// the selected slot's region — vertices in bone-local space, UVs via affineUV over
// the region quad, triangles by ear-clipping the polygon. Replaces the region.
function finishDrawMesh(){
  const done = () => { drawMeshMode = false; drawPoints = []; };
  if (!rawDoc || selSlot == null || drawPoints.length < 3){ done(); renderSlotDetail(); return; }
  const slotIndex = skeletonData.slots.findIndex((s) => s.name === selSlot);
  const sd = skeletonData.slots[slotIndex];
  const attName = sd && sd.attachmentName;
  const att = attName ? skeleton.getAttachment(slotIndex, attName) : null;
  if (!att || att.constructor.name !== "RegionAttachment"){ done(); renderSlotDetail(); return; }
  const slot = skeleton.slots[slotIndex];
  const corners = new Array(8).fill(0);
  att.computeWorldVertices(slot, corners, 0, 2); // region world quad (BL,UL,UR,BR)
  const bone = slot.bone;
  const verts = [], uvs = [], worldFlat = [];
  for (const p of drawPoints){
    const loc = bone.worldToLocal(new SPINE.Vector2(p.x, p.y));
    verts.push(loc.x, loc.y);
    const uv = affineUV(corners, p.x, p.y);
    uvs.push(uv.u, uv.v);
    worldFlat.push(p.x, p.y);
  }
  const tris = earClip(drawPoints.map((_, i) => i), worldFlat) || [];
  const flatTris = [];
  for (const t of tris) flatTris.push(t[0], t[1], t[2]);
  let skinEntry = null;
  for (const sk of rawDoc.skins)
    if (sk.attachments && sk.attachments[selSlot] && sk.attachments[selSlot][attName]){ skinEntry = sk; break; }
  if (!skinEntry){ done(); renderSlotDetail(); return; }
  const region = skinEntry.attachments[selSlot][attName];
  const mesh = { type: "mesh", uvs, triangles: flatTris, vertices: verts, hull: drawPoints.length, width: att.width, height: att.height };
  if (region.path) mesh.path = region.path;
  skinEntry.attachments[selSlot][attName] = mesh;
  done();
  rebuildFromRawDoc(selBone != null ? skeletonData.bones[selBone].name : null);
  markDirty();
}
function cancelDrawMesh(){ drawMeshMode = false; drawPoints = []; renderSlotDetail(); }

// Draw the in-progress boundary polygon while drawing a mesh from scratch.
function drawDrawingOverlay(){
  if (!editMode || !drawMeshMode || !drawPoints.length || typeof renderer.circle !== "function" || !SPINE.Color) return;
  const col = new SPINE.Color(0.49, 0.88, 0.75, 1);
  const r = renderer.camera.zoom * 4;
  const hasLine = typeof renderer.line === "function";
  for (let i = 0; i < drawPoints.length; i++){
    renderer.circle(true, drawPoints[i].x, drawPoints[i].y, r, col, 12);
    if (i > 0 && hasLine) renderer.line(drawPoints[i - 1].x, drawPoints[i - 1].y, drawPoints[i].x, drawPoints[i].y, col);
  }
  if (drawPoints.length > 2 && hasLine){
    const a = drawPoints[drawPoints.length - 1], b = drawPoints[0];
    renderer.line(a.x, a.y, b.x, b.y, col);
  }
}

// Setup-pose WORLD positions of the selected mesh's vertices ([x0,y0,x1,y1,…]).
function meshWorldVerts(){
  if (!meshCtx) return null;
  const att = meshCtx.attachment;
  const slot = skeleton.slots[meshCtx.slotIndex];
  const out = new Array(att.worldVerticesLength).fill(0);
  att.computeWorldVertices(slot, 0, att.worldVerticesLength, out, 0, 2);
  return out;
}

// The rawDoc skin entry for the selected mesh attachment (the persisted geometry).
function rawDocMeshEntry(){
  if (!rawDoc || !meshCtx) return null;
  for (const sk of rawDoc.skins){
    const a = sk.attachments && sk.attachments[selSlot] && sk.attachments[selSlot][meshCtx.attName];
    if (a) return a;
  }
  return null;
}

// Move mesh vertex k by a WORLD delta. Updates BOTH the live MeshAttachment (for
// instant render) and the rawDoc packed array (for export/save). Handles weighted
// (per-influence, in each bone's local space) and unweighted (slot-bone local).
function applyMeshVertexDelta(k, wdx, wdy){
  if (!meshCtx || !rawDoc) return;
  const att = meshCtx.attachment;
  const rd = rawDocMeshEntry();
  if (!rd || !Array.isArray(rd.vertices)) return;

  if (!att.bones || !att.bones.length){
    // unweighted: vertices are [x,y] in the slot bone's local space
    const bone = skeleton.slots[meshCtx.slotIndex].bone;
    const lv = invWorldVec(bone, wdx, wdy);
    att.vertices[k * 2] += lv.x; att.vertices[k * 2 + 1] += lv.y;
    rd.vertices[k * 2] += lv.x; rd.vertices[k * 2 + 1] += lv.y;
    markDirty();
    return;
  }

  // weighted: runtime layout = bones[count,idx…] + vertices[x,y,weight per influence];
  // rawDoc packed layout = [count, (idx,x,y,weight)…]. Walk both to vertex k.
  let rtB = 0, rtV = 0;
  for (let v = 0; v < k; v++){ const n = att.bones[rtB]; rtB += 1 + n; rtV += n * 3; }
  const n = att.bones[rtB];
  let ri = 0;
  for (let v = 0; v < k; v++){ const nn = rd.vertices[ri]; ri += 1 + nn * 4; }
  for (let j = 0; j < n; j++){
    const boneIdx = att.bones[rtB + 1 + j];
    const lv = invWorldVec(skeleton.bones[boneIdx], wdx, wdy);
    att.vertices[rtV + j * 3] += lv.x;       // runtime x
    att.vertices[rtV + j * 3 + 1] += lv.y;   // runtime y
    rd.vertices[ri + 1 + j * 4 + 1] += lv.x; // rawDoc x (after idx)
    rd.vertices[ri + 1 + j * 4 + 2] += lv.y; // rawDoc y
  }
  markDirty();
}

// Cursor → world coordinates (inverse of the camera projection).
function cursorWorld(e){
  const cv = $("#cv"), dpr = window.devicePixelRatio || 1;
  const rect = cv.getBoundingClientRect();
  const x = (e.clientX - rect.left) * dpr;
  const y = (e.clientY - rect.top) * dpr;
  try {
    const v = new SPINE.Vector3(x, cv.height - y, 0); // GL screen y is bottom-up
    renderer.camera.screenToWorld(v, cv.width, cv.height);
    return v;
  } catch { return null; }
}

// Index of the mesh vertex nearest the cursor (within a screen-scaled threshold), else -1.
function nearestMeshVert(e){
  const cw = cursorWorld(e), w = meshWorldVerts();
  if (!cw || !w) return -1;
  let best = -1, bestD = Infinity;
  for (let k = 0; k < w.length / 2; k++){
    const d = Math.hypot(w[k * 2] - cw.x, w[k * 2 + 1] - cw.y);
    if (d < bestD){ bestD = d; best = k; }
  }
  return best >= 0 && bestD < renderer.camera.zoom * 11 ? best : -1;
}
function tryStartMeshDrag(e){ const k = nearestMeshVert(e); if (k >= 0){ meshDragVert = k; selMeshVert = k; return true; } return false; }

// Edit the selected mesh vertex's region UV (0..1). Updates rawDoc + live regionUVs.
function applyVertexUV(key, value){
  if (selMeshVert == null || !meshCtx || !rawDoc) return;
  const v = parseFloat(value);
  if (Number.isNaN(v)) return;
  const rd = rawDocMeshEntry();
  if (!rd || !Array.isArray(rd.uvs)) return;
  const idx = key === "u" ? selMeshVert * 2 : selMeshVert * 2 + 1;
  rd.uvs[idx] = v;
  const att = meshCtx.attachment;
  if (att.regionUVs){ att.regionUVs[idx] = v; if (att.updateRegion) att.updateRegion(); }
  markDirty();
}

// Draw the selected mesh's vertices as handles (world space, via the shape API).
function drawMeshOverlay(){
  if (!editMode || !meshCtx || typeof renderer.circle !== "function" || !SPINE.Color) return;
  const w = meshWorldVerts();
  if (!w) return;
  const col = new SPINE.Color(0.36, 0.69, 1, 1);
  const sel = new SPINE.Color(0.49, 0.88, 0.75, 1);
  const edge = new SPINE.Color(0.36, 0.69, 1, 0.45);
  // triangulation wireframe
  const tris = meshCtx.attachment.triangles;
  if (tris && typeof renderer.line === "function")
    for (let t = 0; t < tris.length; t += 3){
      const a = tris[t], b = tris[t + 1], c = tris[t + 2];
      renderer.line(w[a * 2], w[a * 2 + 1], w[b * 2], w[b * 2 + 1], edge);
      renderer.line(w[b * 2], w[b * 2 + 1], w[c * 2], w[c * 2 + 1], edge);
      renderer.line(w[c * 2], w[c * 2 + 1], w[a * 2], w[a * 2 + 1], edge);
    }
  // vertex handles (selected/dragged highlighted)
  const r = renderer.camera.zoom * 4;
  const heatmap = weightBrush && brushBone != null;
  for (let k = 0; k < w.length / 2; k++){
    const c = k === selMeshVert || k === meshDragVert ? sel
      : heatmap ? heatColor(liveVertexWeight(k, brushBone)) : col;
    renderer.circle(true, w[k * 2], w[k * 2 + 1], r, c, 12);
  }
}

// Barycentric coords of (px,py) in triangle a/b/c — {u,v,w} weight a/b/c.
function bary(px, py, ax, ay, bx, by, cx, cy){
  const v0x = bx - ax, v0y = by - ay, v1x = cx - ax, v1y = cy - ay, v2x = px - ax, v2y = py - ay;
  const d00 = v0x * v0x + v0y * v0y, d01 = v0x * v1x + v0y * v1y, d11 = v1x * v1x + v1y * v1y;
  const d20 = v2x * v0x + v2y * v0y, d21 = v2x * v1x + v2y * v1y;
  const denom = d00 * d11 - d01 * d01;
  if (Math.abs(denom) < 1e-9) return null;
  const v = (d11 * d20 - d01 * d21) / denom, w = (d00 * d21 - d01 * d20) / denom;
  return { u: 1 - v - w, v, w };
}

// Influences of weighted-mesh vertex i, read from a rawDoc PACKED vertices array.
function packedInfluences(verts, i){
  let ri = 0;
  for (let v = 0; v < i; v++){ const n = verts[ri]; ri += 1 + n * 4; }
  const n = verts[ri], out = [];
  for (let j = 0; j < n; j++) out.push({ bone: verts[ri + 1 + j * 4], w: verts[ri + 1 + j * 4 + 3] });
  return out;
}

// Add a mesh vertex at world (Px,Py): find the containing triangle, split it into
// three, and barycentric-interpolate the new vertex's UV and (weighted) bone
// influences from the triangle's corners. Mutates rawDoc + rebuilds. The hull is
// untouched (the new vertex is interior, appended after existing vertices).
function addMeshVertex(Px, Py){
  if (!meshCtx || !rawDoc) return false;
  const att = meshCtx.attachment;
  const rd = rawDocMeshEntry();
  if (!rd || !Array.isArray(rd.triangles) || !Array.isArray(rd.uvs)) return false;
  const w = meshWorldVerts();
  if (!w) return false;

  let bc = null;
  for (let t = 0; t < rd.triangles.length; t += 3){
    const ia = rd.triangles[t], ib = rd.triangles[t + 1], ic = rd.triangles[t + 2];
    const r = bary(Px, Py, w[ia * 2], w[ia * 2 + 1], w[ib * 2], w[ib * 2 + 1], w[ic * 2], w[ic * 2 + 1]);
    if (r && r.u >= -1e-4 && r.v >= -1e-4 && r.w >= -1e-4){ bc = { t, ia, ib, ic, ...r }; break; }
  }
  if (!bc) return false; // clicked outside the mesh

  const n = rd.uvs.length / 2; // new vertex index
  rd.uvs.push(
    bc.u * rd.uvs[bc.ia * 2] + bc.v * rd.uvs[bc.ib * 2] + bc.w * rd.uvs[bc.ic * 2],
    bc.u * rd.uvs[bc.ia * 2 + 1] + bc.v * rd.uvs[bc.ib * 2 + 1] + bc.w * rd.uvs[bc.ic * 2 + 1],
  );

  if (!att.bones || !att.bones.length){
    const bone = skeleton.slots[meshCtx.slotIndex].bone;
    const loc = bone.worldToLocal(new SPINE.Vector2(Px, Py));
    rd.vertices.push(loc.x, loc.y);
  } else {
    const map = new Map();
    for (const [corner, cw] of [[bc.ia, bc.u], [bc.ib, bc.v], [bc.ic, bc.w]])
      for (const inf of packedInfluences(rd.vertices, corner))
        map.set(inf.bone, (map.get(inf.bone) || 0) + cw * inf.w);
    const entries = [...map.entries()].filter(([, wt]) => wt > 1e-6);
    let sum = 0; for (const [, wt] of entries) sum += wt; if (sum <= 0) sum = 1;
    rd.vertices.push(entries.length);
    for (const [boneIdx, wt] of entries){
      const loc = skeleton.bones[boneIdx].worldToLocal(new SPINE.Vector2(Px, Py));
      rd.vertices.push(boneIdx, loc.x, loc.y, wt / sum);
    }
  }

  // replace the containing triangle with three fanned to the new vertex
  rd.triangles.splice(bc.t, 3, bc.ia, bc.ib, n, bc.ib, bc.ic, n, bc.ic, bc.ia, n);
  rebuildFromRawDoc(selBone != null ? skeletonData.bones[selBone].name : null);
  markDirty();
  return true;
}

// Convert the selected slot's region attachment into an editable quad MESH that
// covers the same image: 4 corner vertices (the region's bone-local corners, from
// its computed offset), unit-square UVs in the same corner order, 2 triangles, hull
// 4. Geometry is identical to the region; afterwards the mesh-edit tools apply.
function convertRegionToMesh(){
  if (selSlot == null || !rawDoc) return;
  const slotIndex = skeletonData.slots.findIndex((s) => s.name === selSlot);
  const sd = skeletonData.slots[slotIndex];
  const attName = sd && sd.attachmentName;
  if (!attName) return;
  const att = skeleton.getAttachment(slotIndex, attName);
  if (!att || att.constructor.name !== "RegionAttachment") return;
  if (att.updateRegion) att.updateRegion();
  if (!att.offset) return;
  let skinEntry = null;
  for (const sk of rawDoc.skins)
    if (sk.attachments && sk.attachments[selSlot] && sk.attachments[selSlot][attName]){ skinEntry = sk; break; }
  if (!skinEntry) return;
  const region = skinEntry.attachments[selSlot][attName];
  const mesh = {
    type: "mesh",
    // corner order BL, UL, UR, BR (RegionAttachment.offset order) → matching UVs
    uvs: [0, 1, 0, 0, 1, 0, 1, 1],
    triangles: [0, 1, 2, 2, 3, 0],
    vertices: Array.from(att.offset),
    hull: 4,
    width: att.width,
    height: att.height,
  };
  if (region.path) mesh.path = region.path;
  if (region.color) mesh.color = region.color;
  skinEntry.attachments[selSlot][attName] = mesh;
  rebuildFromRawDoc(selBone != null ? skeletonData.bones[selBone].name : null);
  markDirty();
}

// ---- weight editing (Phase 4.1) -------------------------------------------
// Read vertex k's influences from a rawDoc PACKED weighted-vertices array.
function rdVertexAt(rd, k){
  let ri = 0;
  for (let v = 0; v < k; v++){ const n = rd.vertices[ri]; ri += 1 + n * 4; }
  const count = rd.vertices[ri], influences = [];
  for (let j = 0; j < count; j++){ const o = ri + 1 + j * 4; influences.push({ bone: rd.vertices[o], x: rd.vertices[o + 1], y: rd.vertices[o + 2], weight: rd.vertices[o + 3] }); }
  return { offset: ri, count, influences };
}
// Rewrite vertex k's influences in the packed array (count may change).
function rdSetVertexInfluences(rd, k, influences){
  let ri = 0;
  for (let v = 0; v < k; v++){ const n = rd.vertices[ri]; ri += 1 + n * 4; }
  const oldLen = 1 + rd.vertices[ri] * 4;
  const flat = [influences.length];
  for (const inf of influences) flat.push(inf.bone, inf.x, inf.y, inf.weight);
  rd.vertices.splice(ri, oldLen, ...flat);
}
// Set influence j to weight w; scale the OTHER influences to fill (1−w).
function normalizeKeeping(influences, j, w){
  w = Math.max(0, Math.min(1, w));
  influences[j].weight = w;
  let other = 0; for (let i = 0; i < influences.length; i++) if (i !== j) other += influences[i].weight;
  const rem = 1 - w;
  if (other > 1e-9){ for (let i = 0; i < influences.length; i++) if (i !== j) influences[i].weight *= rem / other; }
  else { const n = influences.length - 1; if (n > 0) for (let i = 0; i < influences.length; i++) if (i !== j) influences[i].weight = rem / n; }
}
// Update the live runtime weights for vertex k (weight-only, count unchanged).
function liveSetVertexWeights(k, weights){
  const att = meshCtx.attachment;
  if (!att.bones || !att.bones.length) return;
  let bi = 0, vi = 0;
  for (let v = 0; v < k; v++){ const n = att.bones[bi]; bi += 1 + n; vi += n * 3; }
  const n = att.bones[bi];
  for (let j = 0; j < n && j < weights.length; j++) att.vertices[vi + j * 3 + 2] = weights[j];
}

function setVertexWeight(k, j, w){
  if (!meshCtx || !rawDoc || Number.isNaN(w)) return;
  const rd = rawDocMeshEntry(); if (!rd) return;
  const { influences } = rdVertexAt(rd, k);
  if (j >= influences.length) return;
  normalizeKeeping(influences, j, w);
  rdSetVertexInfluences(rd, k, influences); // count unchanged
  liveSetVertexWeights(k, influences.map((i) => i.weight));
  markDirty();
  renderSlotDetail(); // refresh the other inputs' displayed values
}

function addInfluence(k, boneIdx){
  if (!meshCtx || !rawDoc) return;
  const rd = rawDocMeshEntry(); if (!rd) return;
  const w = meshWorldVerts(); if (!w) return;
  const loc = skeleton.bones[boneIdx].worldToLocal(new SPINE.Vector2(w[k * 2], w[k * 2 + 1]));
  const { influences } = rdVertexAt(rd, k);
  influences.push({ bone: boneIdx, x: loc.x, y: loc.y, weight: 0 }); // 0 weight → vertex doesn't move
  rdSetVertexInfluences(rd, k, influences);
  rebuildFromRawDoc(selBone != null ? skeletonData.bones[selBone].name : null);
  markDirty();
}

function removeInfluence(k, j){
  if (!meshCtx || !rawDoc) return;
  const rd = rawDocMeshEntry(); if (!rd) return;
  const { influences } = rdVertexAt(rd, k);
  if (influences.length <= 1) return;
  influences.splice(j, 1);
  let s = 0; for (const i of influences) s += i.weight;
  if (s > 1e-9) for (const i of influences) i.weight /= s;
  else { const n = influences.length; for (const i of influences) i.weight = 1 / n; }
  rdSetVertexInfluences(rd, k, influences);
  rebuildFromRawDoc(selBone != null ? skeletonData.bones[selBone].name : null);
  markDirty();
}

// Convert an UNWEIGHTED mesh to weighted, binding every vertex 100% to the slot's
// bone (its existing [x,y] are already in that bone's local space — exact, no move).
function bindMeshToSlotBone(){
  if (!meshCtx || !rawDoc) return;
  const rd = rawDocMeshEntry(); if (!rd) return;
  const att = meshCtx.attachment;
  if (att.bones && att.bones.length) return; // already weighted
  const slot = skeleton.slots[meshCtx.slotIndex];
  const bi = skeletonData.bones.findIndex((b) => b.name === slot.bone.data.name);
  if (bi < 0) return;
  const vc = rd.uvs.length / 2, nv = [];
  for (let k = 0; k < vc; k++) nv.push(1, bi, rd.vertices[k * 2], rd.vertices[k * 2 + 1], 1);
  rd.vertices = nv;
  rebuildFromRawDoc(selBone != null ? skeletonData.bones[selBone].name : null);
  markDirty();
}

// Live weight of vertex k toward boneIdx (0 if not an influence) — for the heatmap.
function liveVertexWeight(k, boneIdx){
  const att = meshCtx.attachment;
  if (!att.bones || !att.bones.length) return 0;
  let bi = 0, vi = 0;
  for (let v = 0; v < k; v++){ const n = att.bones[bi]; bi += 1 + n; vi += n * 3; }
  const n = att.bones[bi];
  for (let j = 0; j < n; j++) if (att.bones[bi + 1 + j] === boneIdx) return att.vertices[vi + j * 3 + 2];
  return 0;
}
function heatColor(t){
  t = Math.max(0, Math.min(1, t));
  return new SPINE.Color(0.2 + 0.8 * t, 0.45 * (1 - t) + 0.25 * t, 1 - 0.85 * t, 1); // blue→red
}

// One brush dab: push weight toward brushBone for every vertex within the brush
// radius (linear falloff), adding the bone where missing, renormalising, then rebuild.
function paintDab(px, py){
  if (!meshCtx || !rawDoc || brushBone == null) return;
  const rd = rawDocMeshEntry(); if (!rd) return;
  const w = meshWorldVerts(); if (!w) return;
  const radius = brushRadiusPx * renderer.camera.zoom;
  const r2 = radius * radius;
  let changed = false;
  for (let k = 0; k < w.length / 2; k++){
    const dx = w[k * 2] - px, dy = w[k * 2 + 1] - py, d2 = dx * dx + dy * dy;
    if (d2 > r2) continue;
    const falloff = 1 - Math.sqrt(d2) / radius;
    const delta = (brushSubtract ? -1 : 1) * brushStrength * falloff;
    const { influences } = rdVertexAt(rd, k);
    let tj = influences.findIndex((i) => i.bone === brushBone);
    if (tj < 0){
      if (brushSubtract) continue;
      const loc = skeleton.bones[brushBone].worldToLocal(new SPINE.Vector2(w[k * 2], w[k * 2 + 1]));
      influences.push({ bone: brushBone, x: loc.x, y: loc.y, weight: 0 });
      tj = influences.length - 1;
    }
    normalizeKeeping(influences, tj, influences[tj].weight + delta);
    rdSetVertexInfluences(rd, k, influences);
    changed = true;
  }
  if (changed){ rebuildFromRawDoc(selBone != null ? skeletonData.bones[selBone].name : null); markDirty(); }
}

// Ear-clip a polygon (ordered ring of vertex indices, positions from worldPos) into
// triangles of those indices. Returns null if it can't triangulate (degenerate).
function earClip(ring, worldPos){
  const P = ring.map((i) => ({ i, x: worldPos[i * 2], y: worldPos[i * 2 + 1] }));
  let area = 0;
  for (let i = 0; i < P.length; i++){ const j = (i + 1) % P.length; area += P[i].x * P[j].y - P[j].x * P[i].y; }
  if (area < 0) P.reverse();
  const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
  const inTri = (p, a, b, c) => {
    const d1 = cross(a, b, p), d2 = cross(b, c, p), d3 = cross(c, a, p);
    return !(((d1 < 0) || (d2 < 0) || (d3 < 0)) && ((d1 > 0) || (d2 > 0) || (d3 > 0)));
  };
  const v = P.slice(), tris = [];
  let guard = 0;
  while (v.length > 3 && guard++ < 2000){
    let clipped = false;
    for (let i = 0; i < v.length; i++){
      const a = v[(i - 1 + v.length) % v.length], b = v[i], c = v[(i + 1) % v.length];
      if (cross(a, b, c) <= 0) continue; // reflex/collinear → not an ear
      let ear = true;
      for (const q of v){ if (q === a || q === b || q === c) continue; if (inTri(q, a, b, c)){ ear = false; break; } }
      if (!ear) continue;
      tris.push([a.i, b.i, c.i]); v.splice(i, 1); clipped = true; break;
    }
    if (!clipped) return null;
  }
  if (v.length === 3) tris.push([v[0].i, v[1].i, v[2].i]);
  return tris;
}

// Remove an INTERIOR mesh vertex k: ear-clip the hole left by its triangle fan, drop
// the vertex from uvs/vertices, reindex triangles, then rebuild. Hull vertices
// (index < hull) are not removable yet.
function removeMeshVertex(k){
  if (!meshCtx || !rawDoc) return false;
  const rd = rawDocMeshEntry();
  if (!rd || !Array.isArray(rd.triangles)) return false;
  const hull = rd.hull || 0;
  if (k < hull){ showErr("Hull vertices can't be removed yet."); return false; }
  if (rd.uvs.length / 2 <= 3) return false;
  const w = meshWorldVerts();
  if (!w) return false;
  const tris = rd.triangles;

  // directed boundary edges of the fan around k (the two non-k verts, in winding order)
  const edges = [];
  for (let t = 0; t < tris.length; t += 3){
    const a = tris[t], b = tris[t + 1], c = tris[t + 2];
    if (a !== k && b !== k && c !== k) continue;
    if (a === k) edges.push([b, c]); else if (b === k) edges.push([c, a]); else edges.push([a, b]);
  }
  if (edges.length < 3){ showErr("Can't remove this vertex (not a simple interior fan)."); return false; }
  // chain edges into one ordered ring
  const nxt = new Map(); for (const [f, to] of edges) nxt.set(f, to);
  const startV = edges[0][0], ring = [startV];
  let cur = nxt.get(startV), guard = 0;
  while (cur !== undefined && cur !== startV && guard++ < edges.length + 2){ ring.push(cur); cur = nxt.get(cur); }
  if (cur !== startV || ring.length !== edges.length){ showErr("Can't remove this vertex (non-manifold ring)."); return false; }

  const filled = earClip(ring, w);
  if (!filled){ showErr("Re-triangulation failed for this vertex."); return false; }

  // keep triangles not using k, add the fill
  const kept = [];
  for (let t = 0; t < tris.length; t += 3){
    const a = tris[t], b = tris[t + 1], c = tris[t + 2];
    if (a !== k && b !== k && c !== k) kept.push(a, b, c);
  }
  for (const tri of filled) kept.push(tri[0], tri[1], tri[2]);

  // drop vertex k from uvs + vertices (packed/unweighted)
  rd.uvs.splice(k * 2, 2);
  const att = meshCtx.attachment;
  if (!att.bones || !att.bones.length){
    rd.vertices.splice(k * 2, 2);
  } else {
    let ri = 0; for (let vtx = 0; vtx < k; vtx++){ const n = rd.vertices[ri]; ri += 1 + n * 4; }
    const n = rd.vertices[ri]; rd.vertices.splice(ri, 1 + n * 4);
  }
  // reindex triangles referencing a vertex after k
  for (let i = 0; i < kept.length; i++) if (kept[i] > k) kept[i]--;
  rd.triangles = kept;
  // `edges` is a derived editor hint indexed by 2×vertex — drop it on topology change
  delete rd.edges;

  rebuildFromRawDoc(selBone != null ? skeletonData.bones[selBone].name : null);
  markDirty();
  return true;
}
