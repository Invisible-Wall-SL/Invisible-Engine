<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invisible Rig Viewer</title>
<script src="/shared/color-field.js" defer></script>
<style>
  :root {
    --bg:#1b1d22; --panel:#23262d; --panel2:#2b2f38; --line:#363b45;
    --txt:#d7dbe2; --dim:#8b93a1; --accent:#5db0ff; --accent2:#7ee0c0;
    --danger:#ff7a7a;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt);
    font:13px/1.4 "Segoe UI",system-ui,sans-serif; }
  body { display:flex; flex-direction:column; }
  #app { display:flex; flex:1; min-height:0; }
  /* unified tool bar — mirrors the launcher $lib/ToolTopBar.svelte */
  .iw-toolbar { display:flex; align-items:center; gap:16px; padding:8px 14px;
    background:var(--panel); border-bottom:1px solid var(--line); flex:0 0 auto; }
  .iw-brand { display:flex; align-items:center; gap:9px; flex:none; font-weight:700;
    letter-spacing:.14em; text-transform:uppercase; color:var(--accent2);
    font-size:14px; text-decoration:none; white-space:nowrap; }
  /* "Tools" dropdown — visual twin of the launcher $lib/ToolTopBar.svelte switcher */
  .iw-switcher{position:relative;display:flex;align-items:center;min-width:0;flex:1 1 auto}
  .iw-switch-btn{display:inline-flex;align-items:center;gap:7px;flex:none;padding:5px 9px 5px 10px;
    border-radius:8px;border:1px solid #2c2c38;background:#15151c;color:#b9b9c4;font:inherit;
    font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer}
  .iw-switch-btn:hover,.iw-switch-btn.on{background:#1b1b22;border-color:#3a3a4a;color:#e8e8ee}
  .iw-switch-btn .ic{display:inline-flex;width:16px;height:16px;color:#7ee0c0}
  .iw-switch-btn .chev{width:12px;height:12px;color:#6f6f7c;transition:transform .14s}
  .iw-switch-btn.on .chev{transform:rotate(180deg)}
  .iw-switch-menu{position:absolute;top:calc(100% + 8px);left:0;z-index:1000;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:6px 10px;
    width:min(920px,calc(100vw - 32px));max-height:calc(100vh - 90px);overflow-y:auto;padding:12px;
    border-radius:12px;border:1px solid #2c2c38;background:#121218;
    box-shadow:0 18px 48px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.4)}
  .iw-switch-menu[hidden]{display:none}
  @media (max-width:1000px){.iw-switcher{position:static}.iw-toolbar{position:relative}
    .iw-switch-menu{top:100%;left:12px;right:12px;width:auto}}
  .iw-stage{display:flex;flex-direction:column;gap:2px;min-width:0}
  .iw-stage h3{margin:0 0 4px;padding:2px 8px 6px;border-bottom:2px solid color-mix(in srgb,var(--accent) 45%,transparent);
    color:var(--accent);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
  .iw-tool{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;color:#b9b9c4;
    text-decoration:none;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .iw-tool .ic{display:inline-flex;flex:none;width:16px;height:16px;color:var(--accent)}
  .iw-tool .ic svg{width:16px;height:16px;display:block}
  .iw-tool:hover,.iw-tool:focus-visible{background:color-mix(in srgb,var(--accent) 12%,#1b1b22);color:#f2f2f6;outline:none}
  .iw-report { display:inline-flex; align-items:center; flex:none; padding:5px 10px; border-radius:8px;
    border:1px solid #3a2a33; color:#f778ba; font-size:12px; font-weight:600; text-decoration:none;
    white-space:nowrap; }
  .iw-report:hover { background:#2a1a22; border-color:#6b3550; }
  .iw-report[hidden] { display:none; }
  /* sidebar */
  #side { width:300px; flex:0 0 300px; background:var(--panel); border-right:1px solid var(--line);
    display:flex; flex-direction:column; }
  #brand { padding:12px 14px; border-bottom:1px solid var(--line); }
  #brand b { letter-spacing:.12em; font-size:12px; color:var(--accent2); }
  #brand small { display:block; color:var(--dim); margin-top:2px; font-size:11px; }
  .row { padding:8px 14px; border-bottom:1px solid var(--line); }
  .row label { display:block; color:var(--dim); font-size:11px; margin-bottom:4px;
    text-transform:uppercase; letter-spacing:.06em; }
  select, input[type=text] { width:100%; background:var(--panel2); color:var(--txt);
    border:1px solid var(--line); border-radius:6px; padding:6px 8px; font-size:12px; }
  #filter { margin-bottom:6px; }
  #list { flex:1; overflow:auto; }
  .item { padding:7px 14px; border-bottom:1px solid #2a2e36; cursor:pointer; }
  .item:hover { background:var(--panel2); }
  .item.sel { background:#2f3a48; border-left:3px solid var(--accent); padding-left:11px; }
  .item .nm { font-size:12px; word-break:break-all; }
  .item .meta { color:var(--dim); font-size:10px; margin-top:2px; }
  .badge { display:inline-block; background:#384150; color:var(--accent2);
    border-radius:4px; padding:0 5px; font-size:10px; margin-left:4px; }
  /* main */
  #main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #stage { flex:1; position:relative; overflow:hidden; }
  canvas { width:100%; height:100%; display:block; }
  #hint { position:absolute; left:12px; top:10px; color:var(--dim); font-size:11px;
    pointer-events:none; text-shadow:0 1px 2px #000; }
  #err { position:absolute; left:12px; right:12px; top:10px; background:#3a2326;
    border:1px solid var(--danger); color:#ffd4d4; padding:8px 10px; border-radius:6px;
    font-size:12px; display:none; white-space:pre-wrap; }
  /* controls bar */
  #bar { background:var(--panel); border-top:1px solid var(--line); padding:8px 12px;
    display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  #bar .grp { display:flex; gap:6px; align-items:center; }
  #bar label { color:var(--dim); font-size:11px; }
  button { background:var(--panel2); color:var(--txt); border:1px solid var(--line);
    border-radius:6px; padding:6px 10px; cursor:pointer; font-size:12px; }
  button:hover { border-color:var(--accent); }
  button.active { background:#2f3a48; border-color:var(--accent); color:#fff; }
  #scrub { flex:1; min-width:140px; }
  #speed { width:90px; }
  .pill { color:var(--dim); font-size:11px; }
  #cfgWrap { position:relative; }
  #cfg { position:absolute; bottom:36px; left:0; width:260px; background:var(--panel2);
    border:1px solid var(--line); border-radius:8px; padding:10px; display:none; z-index:5; }
  #cfg.show { display:block; }
  input[type=color] { width:34px; height:26px; padding:0; border:1px solid var(--line);
    background:var(--panel2); border-radius:5px; }
  a.note { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<!-- CRT boot splash — the shared tool loading screen (see /shared/boot-splash.js).
     First tag in <body> so it paints before the viewer's WebGL boot; `boot()` lifts it. -->
<script src="/shared/boot-splash.js" data-tool="Invisible Rig Viewer"
  data-phrases="Loading skeleton index|Parsing atlas pages|Rewinding animation tracks|Binding slot attachments"></script>
<header class="iw-toolbar">
  <a class="iw-brand" id="iw-home" href="/" title="Invisible Launcher">
    <svg width="22" height="18" viewBox="0 0 366 304" aria-hidden="true">
      <g fill="currentColor">
        <polygon points="20,50 40,73 336,9 336,5"/>
        <polygon points="13,55 28,80 21,278 17,278"/>
      </g>
    </svg>
    <span>INVISIBLE RIG VIEWER</span>
  </a>
  <nav class="iw-switcher" id="iw-switcher" aria-label="Switch tool"></nav>
  <a class="iw-report" id="iw-report" hidden>Report bug</a>
</header>
<script>
// Unified tool bar: render the role-gated switcher the launcher baked into the
// URL (`?home` = emblem target, `?tools` = [{id,name,url}]). Icon set mirrors
// roles.ts TOOL_ICONS by id. Keep in sync with $lib/ToolTopBar.svelte.
(function () {
  var qp = new URLSearchParams(location.search);
  var home = qp.get('home');
  var homeEl = document.getElementById('iw-home');
  if (home && homeEl) homeEl.href = home;
  var ICON = {
    editor: '<rect x="4" y="4" width="11" height="11" rx="1"/><rect x="9" y="9" width="11" height="11" rx="1"/>',
    sheetMaker: '<rect x="3" y="3" width="9" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="10" width="7" height="4" rx="1"/><rect x="3" y="14" width="13" height="7" rx="1"/>',
    atlasTool: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
    comfyui: '<circle cx="5" cy="7" r="2"/><circle cx="5" cy="17" r="2"/><circle cx="17" cy="12" r="2"/><path d="M7 7.6l8 3.2"/><path d="M7 16.4l8-3.2"/><path d="M19 12h2"/>',
    componentEditor: '<rect x="3" y="3" width="18" height="18" rx="2"/><rect x="7" y="7" width="6" height="6" rx="1"/><rect x="13" y="11" width="4" height="6" rx="1"/>',
    storybook: '<path d="M12 6c-1.5-1.6-3.8-2.5-6.5-2.5H4v14h1.5c2.7 0 5 .9 6.5 2.5 1.5-1.6 3.8-2.5 6.5-2.5H20v-14h-1.5c-2.7 0-5 .9-6.5 2.5z"/><line x1="12" y1="6" x2="12" y2="20"/>',
    spineViewer: '<circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="6" r="2.2"/><line x1="7.6" y1="16.4" x2="16.4" y2="7.6"/><circle cx="12" cy="12" r="1.3"/>',
    fontMaker: '<path d="M5 17 9.5 6h1L15 17"/><line x1="6.7" y1="13" x2="13.3" y2="13"/><line x1="4" y1="20" x2="20" y2="20"/>',
    localization: '<circle cx="12" cy="12" r="9"/><line x1="3" y1="12" x2="21" y2="12"/><path d="M12 3c2.6 2.6 2.6 15.4 0 18"/><path d="M12 3c-2.6 2.6-2.6 15.4 0 18"/>',
    ftpBrowser: '<circle cx="5" cy="6" r="1"/><line x1="9" y1="6" x2="20" y2="6"/><circle cx="5" cy="12" r="1"/><line x1="9" y1="12" x2="20" y2="12"/><circle cx="5" cy="18" r="1"/><line x1="9" y1="18" x2="20" y2="18"/>',
    gameMaker: '<rect x="2" y="7" width="20" height="10" rx="4"/><line x1="7" y1="12" x2="9" y2="12"/><line x1="8" y1="11" x2="8" y2="13"/><circle cx="15.5" cy="11" r="0.9" fill="currentColor" stroke="none"/><circle cx="17.5" cy="13" r="0.9" fill="currentColor" stroke="none"/>',
    gameConfig: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/><path d="M15 4v16"/><path d="M3 9.5h18"/><path d="M3 14.5h18"/>',
    characters: '<circle cx="14" cy="5" r="2"/><path d="M14 7.5v6l3 6.5"/><path d="M14 13.5l-3 6.5"/><path d="M10.5 10.5l3.5-2 3.5 2"/><path d="M3 9h4"/><path d="M2 13h5"/><path d="M4 17h4"/>',
    cards: '<rect x="3.5" y="6" width="10" height="14" rx="1.5"/><path d="M9 4.6 10.2 4a1.5 1.5 0 0 1 2 .7l6.6 12.6a1.5 1.5 0 0 1-.6 2l-4.7 2.5"/><path d="M6.5 10h4"/><path d="M6.5 13h4"/>',
    director: '<path d="M3 9.75h18v10.5H3z"/><path d="M3 9.75 4.8 4.5h15.9L21 9.75"/><path d="M9 4.5 7.5 9.75"/><path d="M15 4.5l-1.5 5.25"/>',
    pipelineChanges: '<circle cx="6.75" cy="5.25" r="2"/><circle cx="6.75" cy="18.75" r="2"/><circle cx="17.25" cy="9" r="2"/><path d="M6.75 7.25v9.5"/><path d="M17.25 11c0 3.75-5.25 3.75-10.5 5.25"/>',
    pipelineBugs: '<path d="M9 7.5a3 3 0 0 1 6 0"/><rect x="7" y="7.5" width="10" height="12.5" rx="5"/><path d="M12 11v9"/><path d="M7 12H3.5"/><path d="M17 12h3.5"/><path d="M7.5 16.5 4 18.5"/><path d="M16.5 16.5l3.5 2"/><path d="M9.5 5 8 3"/><path d="M14.5 5 16 3"/>',
    gameBugs: '<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/><rect x="10" y="8" width="4" height="6" rx="2"/><path d="M8 10h2"/><path d="M14 10h2"/><path d="M8 12.5h2"/><path d="M14 12.5h2"/>',
    flow: '<rect x="3" y="4" width="6" height="5" rx="1"/><rect x="15" y="9" width="6" height="5" rx="1"/><rect x="3" y="15" width="6" height="5" rx="1"/><path d="M9 6.5h3a2 2 0 0 1 2 2v1"/><path d="M9 17.5h3a2 2 0 0 0 2-2v-1"/>',
    fx: '<path d="M12 3v4"/><path d="M12 17v4"/><path d="M3 12h4"/><path d="M17 12h4"/><path d="M5.6 5.6l2.8 2.8"/><path d="M15.6 15.6l2.8 2.8"/><path d="M18.4 5.6l-2.8 2.8"/><path d="M8.4 15.6l-2.8 2.8"/><circle cx="12" cy="12" r="1.6"/>',
    shaders: '<circle cx="6" cy="6" r="2.2"/><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="12" r="2.2"/><path d="M8.2 6.4c4 .2 4.2 5.6 7.6 5.6"/><path d="M8.2 17.6c4-.2 4.2-5.6 7.6-5.6"/>',
    flipbook: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M7 5v4"/><path d="M11 5v4"/><path d="M15 5v4"/><path d="M7 15v4"/><path d="M11 15v4"/><path d="M15 15v4"/>',
    winText: '<path d="M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-8l-5 4v-4H5a2 2 0 0 1-2-2z"/><line x1="7" y1="8" x2="17" y2="8"/><line x1="7" y1="11.5" x2="13" y2="11.5"/>',
    sound: '<path d="M4 9.5v5h3.5L12 18V6L7.5 9.5H4z"/><path d="M15.5 9.5a4 4 0 0 1 0 5"/><path d="M18 7a7.5 7.5 0 0 1 0 10"/>',
    rigger: '<circle cx="5" cy="19" r="1.8"/><line x1="6.3" y1="17.7" x2="11.5" y2="12.5"/><circle cx="13" cy="11" r="1.8"/><line x1="14.3" y1="9.7" x2="17" y2="7"/><rect x="16" y="4" width="3.5" height="3.5" rx="0.6"/>',
    symbols: '<rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/><rect x="9.6" y="9.6" width="4.8" height="4.8" rx="0.6" fill="currentColor" stroke="none"/>'
  };
  function svg(id) {
    var b = ICON[id];
    if (!b) return '';
    return '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" ' +
      'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + b + '</svg>';
  }
  var tools = [];
  try { tools = JSON.parse(qp.get('tools') || '[]'); } catch (e) {}
  // "Report bug": Pipeline Bug Reports' form with this tool filled in, for whoever has that
  // tool. Where it happened is this page without its query, which can carry a launch token.
  // Mirrors reportBugHref in $lib/toolLinks.ts.
  var bugs = Array.isArray(tools) ? tools.filter(function (t) { return t && t.id === 'pipelineBugs' && t.url; })[0] : null;
  var report = document.getElementById('iw-report');
  if (bugs && report) {
    report.href = bugs.url + '?' + new URLSearchParams({ 'new': '1', 'for': 'spineViewer', page: location.origin + location.pathname }).toString();
    report.title = 'Report a bug in this tool';
    report.hidden = false;
  }
  // "Tools" dropdown — mirrors $lib/ToolTopBar.svelte: one button, and a panel of the
  // other tools grouped by the launcher-baked stage (`t.stage`, tinted by `t.accent`).
  var nav = document.getElementById('iw-switcher');
  var links = Array.isArray(tools) ? tools.filter(function (t) { return t && t.url; }) : [];
  if (nav && links.length) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'iw-switch-btn';
    btn.title = 'Switch to another tool';
    btn.setAttribute('aria-haspopup', 'true');
    btn.setAttribute('aria-expanded', 'false');
    btn.innerHTML = '<span class="ic"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" ' +
      'stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/>' +
      '<rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/>' +
      '</svg></span><span>Tools</span><svg class="chev" viewBox="0 0 12 12" aria-hidden="true">' +
      '<path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.5" ' +
      'stroke-linecap="round" stroke-linejoin="round"/></svg>';
    var menu = document.createElement('div');
    menu.className = 'iw-switch-menu';
    menu.hidden = true;
    var group = null, stage;
    links.forEach(function (t) {
      var accent = /^#[0-9a-fA-F]{6}$/.test(t.accent || '') ? t.accent : '#8a8a93';
      if (!group || t.stage !== stage) {
        stage = t.stage;
        group = document.createElement('section');
        group.className = 'iw-stage';
        group.style.setProperty('--accent', accent);
        if (stage) {
          var h = document.createElement('h3');
          h.textContent = stage;
          group.appendChild(h);
        }
        menu.appendChild(group);
      }
      var a = document.createElement('a');
      a.className = 'iw-tool';
      a.href = t.url;
      a.title = t.name || '';
      var ic = document.createElement('span');
      ic.className = 'ic';
      ic.innerHTML = svg(t.id);
      var lb = document.createElement('span');
      lb.textContent = (t.name || '').replace(/^Invisible /, '');
      a.appendChild(ic);
      a.appendChild(lb);
      group.appendChild(a);
    });
    var setOpen = function (open) {
      menu.hidden = !open;
      btn.classList.toggle('on', open);
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    };
    btn.addEventListener('click', function () { setOpen(menu.hidden); });
    window.addEventListener('pointerdown', function (e) {
      if (!menu.hidden && !nav.contains(e.target)) setOpen(false);
    });
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !menu.hidden) { setOpen(false); btn.focus(); }
    });
    nav.appendChild(btn);
    nav.appendChild(menu);
  }
})();
</script>
<div id="app">
  <aside id="side">
    <div id="brand">
      <b>INVISIBLE RIG VIEWER</b>
      <small id="sub">Invisible Wall SL</small>
    </div>
    <div class="row">
      <label>Active project</label>
      <select id="project"></select>
      <div id="projNote" class="pill" style="margin-top:5px;"></div>
    </div>
    <div class="row">
      <label>Skeletons <span id="count" class="pill"></span>
        <button id="rescan" style="float:right;padding:1px 7px;font-size:11px;">rescan</button></label>
      <input type="text" id="filter" placeholder="filter…">
    </div>
    <div id="list"></div>
  </aside>

  <main id="main">
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="hint">scroll = zoom · drag = pan</div>
      <div id="err"></div>
    </div>
    <div id="bar">
      <div class="grp">
        <button id="play">▶ Play</button>
        <button id="loop" class="active">↻ Loop</button>
      </div>
      <div class="grp">
        <label>Anim</label>
        <select id="anim" style="width:160px;"></select>
      </div>
      <div class="grp">
        <label>Skin</label>
        <select id="skin" style="width:120px;"></select>
      </div>
      <input type="range" id="scrub" min="0" max="1000" value="0">
      <span id="time" class="pill">0.00s</span>
      <div class="grp">
        <label>Speed</label>
        <input type="range" id="speed" min="0" max="200" value="100">
        <span id="speedv" class="pill">1.0×</span>
      </div>
      <div id="cfgWrap" class="grp">
        <button id="cfgBtn">⚙</button>
        <div id="cfg">
          <label style="color:var(--dim);font-size:11px;">Background</label>
          <input type="color" id="bg" value="#1b1d22">
          <label style="display:block;margin-top:8px;">
            <input type="checkbox" id="preferPng" checked> Prefer PNG pages (avoid lossy WebP alpha)</label>
          <label style="display:block;margin-top:6px;">
            <input type="checkbox" id="pma" checked> Premultiply alpha (fixes additive halos)</label>
          <label style="display:block;margin-top:6px;">
            <input type="checkbox" id="bones"> Show bones</label>
          <label style="display:block;margin-top:6px;">
            <input type="checkbox" id="mesh"> Show mesh (hull + triangles)</label>
          <label style="display:block;margin-top:6px;">
            <input type="checkbox" id="clip"> Show clipping polygons</label>
          <div style="margin-top:8px;"><button id="fit">Reset view</button></div>
        </div>
      </div>
      <span id="rt" class="pill"></span>
    </div>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
let RIG = null, loadedLine = null;
let gl, renderer, assetMgr;
let skeleton, animState, skeletonData, lastFrame = 0;
let playing = true, looping = true, showBones = false, pma = true, preferPng = true;
let showMesh = false, showClip = false;
let curEntry = null, dragging = false, lastXY = null;
let skeletons = [], selected = null, bgColor = {r:0.106,g:0.114,b:0.133,a:1};

// ---- runtime loading (the Invisible rig runtime, loaded once) -------------
// One runtime reads every rig, 4.1 and 4.2 exports alike — the same skeleton code the game runs.
function loadRuntime(line){
  return new Promise((resolve, reject) => {
    if (window.invisibleRig){ RIG = window.invisibleRig; loadedLine = line; return resolve(); }
    const s = document.createElement("script");
    // Cache-bust the stable-name vendored runtime with the deploy version `?v=` the /rig-viewer route
    // passed in (see buildId.ts) — else the browser serves a stale invisible-rig.js after a redeploy.
    const _v = new URLSearchParams(location.search).get("v");
    s.src = "/rig-viewer/vendor/invisible-rig.js" + (_v ? "?v=" + encodeURIComponent(_v) : "");
    s.onload = () => { RIG = window.invisibleRig; loadedLine = line; resolve(); };
    s.onerror = () => reject(new Error("Failed to load the rig runtime"));
    document.head.appendChild(s);
  });
}

function showErr(msg){ const e = $("#err"); e.textContent = msg; e.style.display = "block"; }
function clearErr(){ $("#err").style.display = "none"; }

// ---- GL / renderer --------------------------------------------------------
function initGL(){
  const cv = $("#cv");
  gl = cv.getContext("webgl", {alpha:true, premultipliedAlpha:false})
    || cv.getContext("experimental-webgl");
  renderer = new RIG.SceneRenderer(cv, gl);
  assetMgr = new RIG.AssetManager(gl);
}

function resizeCanvas(){
  const cv = $("#cv"), dpr = window.devicePixelRatio || 1;
  const w = Math.floor(cv.clientWidth * dpr), h = Math.floor(cv.clientHeight * dpr);
  if (cv.width !== w || cv.height !== h){ cv.width = w; cv.height = h; }
}

function updateWorld(){
  if (RIG.Physics && RIG.Physics.update !== undefined)
    skeleton.updateWorldTransform(RIG.Physics.update);
  else
    skeleton.updateWorldTransform();
}

// ---- load a skeleton ------------------------------------------------------
async function selectSkeleton(entry){
  selected = entry;
  renderList();
  clearErr();
  $("#rt").textContent = "runtime " + entry.runtime + (entry.version ? " · rig " + entry.version : "");

  // Cross-version switch needs a clean global → reload the page with intent.
  if (loadedLine && loadedLine !== entry.runtime){
    location.hash = "id=" + entry.id + "&rt=" + entry.runtime;
    location.reload();
    return;
  }
  try {
    await loadRuntime(entry.runtime);
  } catch(e){ showErr(String(e.message || e)); return; }

  if (!gl) initGL();

  const base = "/rig-viewer/file?dir=" + encodeURIComponent(entry.dir_b64) + (preferPng ? "&pp=1" : "")
    + "&v=" + Date.now() + "&name=";  // cache-bust so freshly-deployed art shows
  // Fresh AssetManager rooted at this skeleton's folder.
  assetMgr = new RIG.AssetManager(gl, base);
  assetMgr.loadTextureAtlas(entry.atlas_file);
  if (entry.format === "skel") assetMgr.loadBinary(entry.skeleton_file);
  else assetMgr.loadJson(entry.skeleton_file);

  await waitAssets();
  try { buildSkeleton(entry); }
  catch(e){ showErr("Build failed: " + (e.message || e)); }
}

function waitAssets(){
  return new Promise((resolve, reject) => {
    const tick = () => {
      if (assetMgr.isLoadingComplete()){
        const errs = assetMgr.getErrors && assetMgr.getErrors();
        if (errs && Object.keys(errs).length){
          reject(new Error("Asset load error:\n" + JSON.stringify(errs, null, 2)));
        } else resolve();
      } else requestAnimationFrame(tick);
    };
    tick();
  });
}

// Rig exports here are straight-alpha PNGs whose transparent texels carry
// white RGB. Additive attachments (glows/particles) then show a white box.
// Premultiplying on upload zeroes RGB wherever alpha is 0, so additive (rendered
// premultiplied) adds nothing in transparent areas and edge bilinear filtering
// fades to black instead of white. The runtime forces UNPACK_PREMULTIPLY=false,
// so we re-upload each page ourselves.
function premultiplyAtlas(atlas){
  if (!gl || !atlas || !atlas.pages) return;
  atlas.pages.forEach(p => {
    const tex = p.texture;
    if (!tex || !tex._image || !tex.texture) return;
    gl.bindTexture(gl.TEXTURE_2D, tex.texture);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, tex._image);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  });
}

function buildSkeleton(entry){
  const atlas = assetMgr.require(entry.atlas_file);
  if (pma) premultiplyAtlas(atlas);
  const loader = new RIG.AtlasAttachmentLoader(atlas);
  if (entry.format === "skel"){
    const bin = new RIG.SkeletonBinary(loader);
    skeletonData = bin.readSkeletonData(new Uint8Array(assetMgr.require(entry.skeleton_file)));
  } else {
    const sj = new RIG.SkeletonJson(loader);
    skeletonData = sj.readSkeletonData(assetMgr.require(entry.skeleton_file));
  }
  skeleton = new RIG.Skeleton(skeletonData);
  animState = new RIG.AnimationState(new RIG.AnimationStateData(skeletonData));

  // populate anim + skin dropdowns
  const aSel = $("#anim"); aSel.innerHTML = "";
  skeletonData.animations.forEach(a => {
    const o = document.createElement("option");
    o.value = a.name; o.textContent = a.name + "  (" + a.duration.toFixed(2) + "s)";
    aSel.appendChild(o);
  });
  const sSel = $("#skin"); sSel.innerHTML = "";
  skeletonData.skins.forEach(sk => {
    const o = document.createElement("option"); o.value = sk.name; o.textContent = sk.name;
    sSel.appendChild(o);
  });
  if (skeletonData.skins.length){
    const def = skeletonData.skins.find(s => s.name === "default") || skeletonData.skins[0];
    skeleton.setSkinByName(def.name); sSel.value = def.name;
  }
  skeleton.setToSetupPose();
  updateWorld();

  if (skeletonData.animations.length){
    aSel.value = skeletonData.animations[0].name;
    setAnim(aSel.value);
  } else { curEntry = null; }

  fitView();
}

function setAnim(name){
  curEntry = animState.setAnimation(0, name, looping);
  playing = true; $("#play").textContent = "❚❚ Pause";
}

// ---- camera / fit ---------------------------------------------------------
function fitView(){
  if (!skeleton) return;
  const off = new RIG.Vector2(), size = new RIG.Vector2();
  skeleton.getBounds(off, size, []);
  const cam = renderer.camera;
  resizeCanvas();
  if (size.x > 0 && size.y > 0){
    cam.position.x = off.x + size.x/2;
    cam.position.y = off.y + size.y/2;
    const vw = $("#cv").width, vh = $("#cv").height;
    cam.zoom = Math.max(size.x/vw, size.y/vh) * 1.25;
  }
  cam.update();
}

// ---- render loop ----------------------------------------------------------
function frame(now){
  requestAnimationFrame(frame);
  const delta = lastFrame ? (now - lastFrame)/1000 : 0; lastFrame = now;
  resizeCanvas();
  if (!renderer){ return; }
  const cv = $("#cv");
  renderer.camera.viewportWidth = cv.width;
  renderer.camera.viewportHeight = cv.height;
  renderer.camera.update();
  gl.clearColor(bgColor.r, bgColor.g, bgColor.b, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.viewport(0, 0, cv.width, cv.height);

  if (skeleton && animState){
    if (playing) animState.update(delta);
    animState.apply(skeleton);
    updateWorld();
    renderer.begin();
    renderer.drawSkeleton(skeleton, pma);
    if (showBones || showMesh || showClip){
      const d = renderer.skeletonDebugRenderer;
      if (d){
        d.drawBones = showBones;
        d.drawRegionAttachments = false;
        d.drawBoundingBoxes = false;
        d.drawMeshHull = showMesh;
        d.drawMeshTriangles = showMesh;
        d.drawClipping = showClip;
        d.drawPaths = false;
      }
      renderer.drawSkeletonDebug(skeleton, false);
    }
    renderer.end();
    syncScrub();
  }
}

function syncScrub(){
  curEntry = animState.getCurrent(0) || curEntry;
  if (!curEntry || !curEntry.animation) return;
  const dur = curEntry.animation.duration || 0.0001;
  const t = curEntry.trackTime % dur;
  $("#scrub").value = Math.round((t/dur)*1000);
  $("#time").textContent = t.toFixed(2) + "s / " + dur.toFixed(2) + "s";
}

// ---- UI wiring ------------------------------------------------------------
function renderList(){
  const q = $("#filter").value.toLowerCase();
  const list = $("#list"); list.innerHTML = "";
  let shown = 0;
  skeletons.forEach(e => {
    if (q && !e.name.toLowerCase().includes(q)) return;
    shown++;
    const d = document.createElement("div");
    d.className = "item" + (selected && selected.id === e.id ? " sel" : "");
    d.innerHTML = '<div class="nm">' + e.name + '</div>' +
      '<div class="meta">' + e.format + (e.version ? ' · ' + e.version : '') +
      '<span class="badge">rt ' + e.runtime + '</span></div>';
    d.onclick = () => selectSkeleton(e);
    list.appendChild(d);
  });
  $("#count").textContent = "(" + shown + ")";
}

async function loadState(){
  // Viewer-only display prefs. The active (client, project) is owned by the
  // launcher and comes back from /rig-viewer/skeletons → setActiveProject().
  bgColor = hexToRGB("#1b1d22"); $("#bg").value = "#1b1d22";
  pma = true; $("#pma").checked = pma;
  $("#projNote").textContent = "";
}

// Reflect the launcher's real active project (resolved server-side) in the
// header + the (read-only) project select. The launcher owns project switching.
function setActiveProject(client, project){
  if (!project) return;
  $("#sub").textContent = project;
  const label = client ? client + " / " + project : project;
  const psel = $("#project"); psel.innerHTML = "";
  const o = document.createElement("option");
  o.value = project; o.textContent = label; o.selected = true;
  psel.appendChild(o);
}

async function loadSkeletons(refresh){
  $("#count").textContent = "(scanning…)";
  const r = await (await fetch("/rig-viewer/skeletons" + (refresh ? "?refresh=1" : ""))).json();
  setActiveProject(r.client, r.project);
  if (r.error){ showErr(r.error); skeletons = []; renderList(); return; }
  skeletons = r.skeletons || [];
  renderList();
  // honour a reload-intent hash: #id= (cross-version switch) or
  // #sel=<dir_b64>|<skeleton_file> (stable return link from the Atlas Maker)
  const h = new URLSearchParams(location.hash.slice(1));
  const id = h.get("id"), sel = h.get("sel");
  let target = null;
  if (sel){
    const [dir, file] = sel.split("|");
    target = skeletons.find(x => x.dir_b64 === dir && x.skeleton_file === file);
  } else if (id !== null){
    target = skeletons.find(x => x.id === parseInt(id, 10));
  }
  if (target){ history.replaceState(null, "", location.pathname); selectSkeleton(target); }
}

function hexToRGB(hex){
  const n = parseInt(hex.replace("#",""), 16);
  return { r:((n>>16)&255)/255, g:((n>>8)&255)/255, b:(n&255)/255, a:1 };
}

function wire(){
  $("#play").onclick = () => {
    playing = !playing; $("#play").textContent = playing ? "❚❚ Pause" : "▶ Play";
  };
  $("#loop").onclick = () => {
    looping = !looping; $("#loop").classList.toggle("active", looping);
    if (curEntry) curEntry.loop = looping;
  };
  $("#anim").onchange = e => setAnim(e.target.value);
  $("#skin").onchange = e => {
    skeleton.setSkinByName(e.target.value); skeleton.setSlotsToSetupPose(); updateWorld();
  };
  $("#speed").oninput = e => {
    const v = e.target.value/100; if (animState) animState.timeScale = v;
    $("#speedv").textContent = v.toFixed(1) + "×";
  };
  $("#scrub").oninput = e => {
    if (!curEntry || !curEntry.animation) return;
    playing = false; $("#play").textContent = "▶ Play";
    const dur = curEntry.animation.duration;
    curEntry.trackTime = (e.target.value/1000)*dur;
    animState.apply(skeleton); updateWorld();
  };
  $("#filter").oninput = renderList;
  $("#rescan").onclick = () => loadSkeletons(true);
  $("#cfgBtn").onclick = () => $("#cfg").classList.toggle("show");
  $("#bg").oninput = e => bgColor = hexToRGB(e.target.value);
  $("#preferPng").onchange = e => { preferPng = e.target.checked; if (selected) selectSkeleton(selected); };
  $("#pma").onchange = e => { pma = e.target.checked; if (selected) selectSkeleton(selected); };
  $("#bones").onchange = e => showBones = e.target.checked;
  $("#mesh").onchange = e => showMesh = e.target.checked;
  $("#clip").onchange = e => showClip = e.target.checked;
  $("#fit").onclick = fitView;
  // (Atlas Maker round-trip and project switching are local-launcher features,
  // omitted in the hosted viewer.)

  // pan + zoom
  const cv = $("#cv");
  cv.addEventListener("wheel", e => {
    e.preventDefault();
    if (!renderer) return;
    const f = e.deltaY > 0 ? 1.1 : 0.9;
    renderer.camera.zoom = Math.max(0.01, Math.min(50, renderer.camera.zoom * f));
  }, {passive:false});
  cv.addEventListener("mousedown", e => { dragging = true; lastXY = [e.clientX, e.clientY]; });
  window.addEventListener("mouseup", () => dragging = false);
  window.addEventListener("mousemove", e => {
    if (!dragging || !renderer) return;
    const dpr = window.devicePixelRatio || 1;
    const dx = (e.clientX - lastXY[0]) * dpr, dy = (e.clientY - lastXY[1]) * dpr;
    renderer.camera.position.x -= dx * renderer.camera.zoom;
    renderer.camera.position.y += dy * renderer.camera.zoom;
    lastXY = [e.clientX, e.clientY];
  });
}

async function boot(){
  wire();
  // a runtime hash means we just reloaded for a cross-version switch
  const h = new URLSearchParams(location.hash.slice(1));
  const rt = h.get("rt");
  if (rt){ try { await loadRuntime(rt); initGL(); } catch(e){ showErr(String(e)); } }
  await loadState();
  await loadSkeletons(false);
  requestAnimationFrame(frame);
  // The CRT boot splash covers everything above; lift it now that the viewer is up.
  if (window.IWBoot) window.IWBoot.done();
}
boot();
</script>
</body>
</html>
