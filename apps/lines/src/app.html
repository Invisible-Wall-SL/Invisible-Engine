<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="stylesheet" href="https://use.typekit.net/aba0ebl.css" />
		<meta name="viewport" content="width=device-width" />

		<!--
			Boot loading-screen API. Defined in <head> — BEFORE SvelteKit's deferred module
			bootstrap and before `+layout.ts`'s `load()` runs — so `window.__ieBoot` always
			exists when the engine calls it. (When this lived at the end of <body> it lost a
			race: on a slow online boot `load()` fired `phase('Fetching from R2…')` at ~7s while
			the parser hadn't yet reached the body script, so the call no-op'd through optional
			chaining and the splash stayed on the bare "Loading".) Methods look elements up
			lazily and buffer state, so calls before the overlay markup is parsed still apply
			once it exists (via `__ieBootApply`, called right after the markup + on DOMContentLoaded).
		-->
		<script>
			(function () {
				var s = { title: '', phase: '', progress: null, finished: false };
				function el(id) {
					return document.getElementById(id);
				}
				function apply() {
					if (s.finished) return;
					var t = el('ie-boot-title');
					if (t && s.title) {
						t.textContent = s.title;
						t.classList.add('ie-show');
					}
					var st = el('ie-boot-status');
					if (st && s.phase) st.textContent = s.phase;
					var f = el('ie-boot-fill');
					if (f && s.progress !== null) {
						f.classList.remove('ie-indet');
						f.style.width = s.progress + '%';
					}
					var p = el('ie-boot-pct');
					if (p && s.progress !== null) p.textContent = Math.round(s.progress) + '%';
				}
				function done() {
					if (s.finished) return;
					s.finished = true;
					var root = el('ie-boot');
					if (!root) return;
					root.classList.add('ie-boot-done');
					setTimeout(function () {
						if (root && root.parentNode) root.parentNode.removeChild(root);
					}, 500);
				}
				window.__ieBoot = {
					title: function (x) {
						if (s.finished || !x) return;
						s.title = String(x);
						apply();
					},
					phase: function (x) {
						if (s.finished || !x) return;
						s.phase = String(x);
						apply();
					},
					progress: function (x) {
						if (s.finished) return;
						s.progress = Math.max(0, Math.min(100, Number(x) || 0));
						apply();
					},
					done: done,
				};
				window.__ieBootApply = apply;
				// Runtime (online) boot: the dominant cost is the JS hydrate (~7s) THEN the
				// `/api/editor/runtime` assemble (~17s cold) — ~24s before any asset loads. Name that
				// whole stretch up front so it never reads as a bare "Loading"; the engine refines it
				// to "Loading assets…" once the bundle lands. Guarded ⇒ offline/dev keeps the default.
				try {
					if (new URLSearchParams(location.search).get('runtime') === '1')
						s.phase = 'Fetching from R2…';
				} catch (e) {}
				if (document.readyState === 'loading')
					document.addEventListener('DOMContentLoaded', apply, { once: true });
				else apply();
				// Safety net: never let a wiring bug pin the splash over a live game. A cold online
				// boot (hydrate + assemble + asset wave) can run ~30s, so give generous margin.
				setTimeout(done, 60000);
			})();
		</script>

		%sveltekit.head%
	</head>
	<body style="margin: 0; padding: 0; overflow: hidden; background-color: black">
		<div>%sveltekit.body%</div>

		<!--
			Boot loading screen. Lives in the static HTML shell (NOT a Svelte component) so
			it paints on the very first frame — before hydration and before `+layout.ts`'s
			blocking `load()` (the cross-origin `/api/editor/runtime` fetch) resolves. That
			pre-mount window is exactly when the online/`?runtime=1` build used to show a
			bare black screen: the in-canvas `LoadingBar` can't exist until Pixi mounts, which
			is after the runtime doc + R2 asset wave. The overlay is driven by `window.__ieBoot`
			(phase text + progress + game name), and removes itself on `done()`. Offline/dev
			(no `?runtime=1`) hits `done()` almost immediately, so it's a no-op flash there.
		-->
		<style>
			#ie-boot {
				position: fixed;
				inset: 0;
				z-index: 99999;
				background: #0a0a0c;
				display: flex;
				align-items: center;
				justify-content: center;
				font-family: 'proxima-nova', system-ui, -apple-system, sans-serif;
				transition: opacity 0.45s ease;
			}
			#ie-boot.ie-boot-done {
				opacity: 0;
				pointer-events: none;
			}
			#ie-boot .ie-boot-inner {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 26px;
				width: min(340px, 62vw);
			}
			#ie-boot svg {
				width: 84px;
				height: auto;
				color: #e9e7df;
			}
			#ie-boot .ie-arm-a {
				animation: ie-pulse-a 1.6s ease-in-out infinite;
			}
			#ie-boot .ie-arm-b {
				animation: ie-pulse-b 1.6s ease-in-out infinite;
			}
			@keyframes ie-pulse-a {
				0%, 100% { opacity: 0.35; }
				50% { opacity: 1; }
			}
			@keyframes ie-pulse-b {
				0%, 100% { opacity: 1; }
				50% { opacity: 0.35; }
			}
			#ie-boot .ie-boot-lockup {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 16px;
			}
			#ie-boot .ie-boot-brand {
				font-size: 15px;
				font-weight: 600;
				letter-spacing: 0.42em;
				padding-left: 0.42em;
				text-transform: uppercase;
				white-space: nowrap;
				color: #cfcdc4;
				animation: ie-brand-in 0.9s ease both;
			}
			/* Shimmer the wordmark where text-clipped gradients are supported; the base rule
			   above is the fallback (fade-in only, always visible). */
			@supports ((-webkit-background-clip: text) or (background-clip: text)) {
				#ie-boot .ie-boot-brand {
					background: linear-gradient(100deg, #6f6d66 33%, #f4f2ea 50%, #6f6d66 67%);
					background-size: 220% 100%;
					-webkit-background-clip: text;
					background-clip: text;
					color: transparent;
					animation: ie-brand-in 0.9s ease both, ie-brand-shimmer 3.4s linear infinite 0.9s;
				}
			}
			@keyframes ie-brand-in {
				from { opacity: 0; transform: translateY(6px); }
				to { opacity: 1; transform: translateY(0); }
			}
			@keyframes ie-brand-shimmer {
				0% { background-position: 210% 0; }
				100% { background-position: -110% 0; }
			}
			#ie-boot .ie-boot-title {
				font-size: 20px;
				font-weight: 500;
				letter-spacing: 0.04em;
				color: #f2f0e8;
				opacity: 0;
				transition: opacity 0.5s ease;
				text-align: center;
				min-height: 1em;
			}
			#ie-boot .ie-boot-title.ie-show {
				opacity: 1;
			}
			#ie-boot .ie-boot-status {
				font-size: 12px;
				letter-spacing: 0.16em;
				text-transform: uppercase;
				color: #8a887f;
				text-align: center;
				min-height: 1em;
			}
			#ie-boot .ie-boot-track {
				width: 100%;
				height: 5px;
				border-radius: 5px;
				background: #1c1c20;
				overflow: hidden;
			}
			#ie-boot .ie-boot-fill {
				height: 100%;
				border-radius: 5px;
				background: #e9e7df;
				width: 12%;
				transition: width 0.3s ease;
			}
			#ie-boot .ie-boot-fill.ie-indet {
				width: 35%;
				transition: none;
				animation: ie-indet 1.15s ease-in-out infinite;
			}
			@keyframes ie-indet {
				0% { margin-left: -35%; }
				100% { margin-left: 100%; }
			}
			#ie-boot .ie-boot-pct {
				font-family: ui-monospace, 'SF Mono', 'Consolas', monospace;
				font-size: 12px;
				color: #5f5e5a;
				min-height: 1em;
			}
		</style>
		<div id="ie-boot">
			<div class="ie-boot-inner">
				<div class="ie-boot-lockup">
					<svg viewBox="0 0 366 304" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
						<g fill="currentColor">
							<polygon class="ie-arm-a" points="20,50 40,73 336,9 336,5" />
							<polygon class="ie-arm-b" points="13,55 28,80 21,278 17,278" />
						</g>
					</svg>
					<div class="ie-boot-brand">Invisible Wall</div>
				</div>
				<div class="ie-boot-title" id="ie-boot-title"></div>
				<div class="ie-boot-status" id="ie-boot-status">Loading…</div>
				<div class="ie-boot-track">
					<div class="ie-boot-fill ie-indet" id="ie-boot-fill"></div>
				</div>
				<div class="ie-boot-pct" id="ie-boot-pct"></div>
			</div>
		</div>
		<!-- Apply any state buffered by the <head> API (e.g. the runtime-mode phase) the instant
		     the overlay markup exists, so the long pre-asset stretch is labelled from first paint. -->
		<script>
			window.__ieBootApply && window.__ieBootApply();
		</script>
	</body>
</html>
