	//check if we are trying to launch a game from game
	if (gwan.getArg("launch") != null)
	{
		var sid = gwan.getArg("sid");
		var session = GsHelper.getSession(sid);
		try
		{
			var game = APIHelper.getGameAndCheckIfItIsEnabledForCasino(gwan.getArg('gameId'), session.casino);
			var casino = Redis.getObjectById('casino', session.casino);
			var session = Session.create(game, casino, session.remoteId, null/*gameRoundId*/, session.demo, session.remote_data);
			echo(session.id);
		}
		catch(e)
		{
			throw new Error('cant launch another game for session: ' + sid);
		}

var error = undefined;

try {
	
	var sid = gwan.getArg("sid");
	var session = GsHelper.getSession(sid);
	if (!session)
	{
		throw new Error('session not found: ' + sid);
	}

	log.info("eanew embed page, referer url: " + gwan.getHeader('referer') + " cid="+ session.casino + " sid=" + sid + " ip=" + Utils.getRemoteIp());

	//check if the session already contains 'state'
	//if it does then it means that the player is re-entering the 
	//client with a pending game round. Then we must delete 'seq' 
	//so that the game round will be restarted from scratch (resume/replay))
	GsHelper.restartGameRound(session);

	var game = APIHelper.getGameAndCheckIfItIsEnabledForCasino(session.game, session.casino);
	var config = Game.getConfigForGameClient(game, session);	
	
	if(typeof(session.gameConfig.cocosVersionPath) != "undefined"){
		session.gameConfig.versionPath = session.gameConfig.cocosVersionPath;
		//this is used to turn gw games into cocos games seamlessly
	}
	
	var cdnUrl = Utils.throwIfCountryCodeIsNotAllowedOrReturnCDNUrl(session);
	
	var gameAlias = game.alias;
	
	var gameName = game.name;
	
	var allowForcing = (GsHelper.isOutcomeForcingAllowed(session) ? 'true':'false');
	
	var vp = session.gameConfig.versionPath ? session.gameConfig.versionPath : '';		

	config['demo'] = session.demo;
	
	config["allowForcing"] = GsHelper.isOutcomeForcingAllowed(session) ? true : false;
	
	/*var gameArgs = JSON.stringify({
		token: sid,
		service: RequestController.getBaseUrl()+'/engine',
		config: config
	});/**/
	
	//var vp = config['versionPath'];
	
	var baseUrl =  cdnUrl + '/eanew/games/' + (vp ? vp : '');
	// delete below comment if locally playing on vm 
	//var baseUrl =  "http://127.0.0.2" + '/eanew/games/pack/' + (vp ? vp : '');
	
	var gameApi = '/'+RequestController.getBaseUrl()+'/engine';

} catch (e)
{
	error = e.message;		
}
